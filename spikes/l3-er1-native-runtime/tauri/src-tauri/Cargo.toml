[package]
name = "angmoo-native-runtime-spike"
version = "0.0.0"
description = "L3-ER1 Tauri and LadybugDB compatibility spike"
authors = ["Angmoo contributors"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "angmoo_native_runtime_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
uuid = { version = "=1.24.1", features = ["v4"] }
