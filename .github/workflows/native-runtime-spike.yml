name: Native Runtime Spike

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-runtime-spike.yml"
      - "spikes/l3-er1-native-runtime/**"
      - "backend/tests/test_l3_er1_native_runtime_spike_contract.py"
      - "docs/architecture/l3-er1-native-runtime-spike.md"
  pull_request:
    paths:
      - ".github/workflows/native-runtime-spike.yml"
      - "spikes/l3-er1-native-runtime/**"
      - "backend/tests/test_l3_er1_native_runtime_spike_contract.py"
      - "docs/architecture/l3-er1-native-runtime-spike.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      backend_profile: ${{ steps.select.outputs.backend_profile }}
      windows: ${{ steps.select.outputs.windows }}
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      local_core_smoke: ${{ steps.select.outputs.local_core_smoke }}
      local_autonomy_smoke: ${{ steps.select.outputs.local_autonomy_smoke }}
      local_full_graph: ${{ steps.select.outputs.local_full_graph }}
      embedded_data_migration: ${{ steps.select.outputs.embedded_data_migration }}
      tauri_windows: ${{ steps.select.outputs.tauri_windows }}
      windows_installer: ${{ steps.select.outputs.windows_installer }}
      windows_native: ${{ steps.select.outputs.windows_native }}
      tauri_windows_host_dev: ${{ steps.select.outputs.tauri_windows_host_dev }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: select
      name: Classify actual changed paths
      run: python scripts/ci/impact.py

  windows-native:
    needs: [impact]
    if: needs.impact.outputs.windows_native == 'true'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.13.12"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/l3-er1-native-runtime/tauri/package-lock.json
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Build and execute LadybugDB and Tauri compatibility proof
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\spikes\l3-er1-native-runtime\scripts\run-spike.ps1
          -WorkRoot "$env:RUNNER_TEMP\angmoo-l3-er1-native-runtime"
