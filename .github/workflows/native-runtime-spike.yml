name: Native Runtime Spike

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-runtime-spike.yml"
      - "spikes/l3-er1-native-runtime/**"
      - "backend/tests/test_l3_er1_native_runtime_spike_contract.py"
      - "docs/architecture/l3-er1-native-runtime-spike.md"
  pull_request:
    paths:
      - ".github/workflows/native-runtime-spike.yml"
      - "spikes/l3-er1-native-runtime/**"
      - "backend/tests/test_l3_er1_native_runtime_spike_contract.py"
      - "docs/architecture/l3-er1-native-runtime-spike.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13.12"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/l3-er1-native-runtime/tauri/package-lock.json
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Build and execute LadybugDB and Tauri compatibility proof
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\spikes\l3-er1-native-runtime\scripts\run-spike.ps1
          -WorkRoot "$env:RUNNER_TEMP\angmoo-l3-er1-native-runtime"
