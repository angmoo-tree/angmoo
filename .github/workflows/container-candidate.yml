name: Container Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build-validate:
    if: github.repository == 'angmoo-tree/angmoo' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build immutable candidates once
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          python -m scripts.release.candidate build --service backend --platform "linux/$ARCH" --output artifacts/release-candidate
          python -m scripts.release.candidate build --service frontend --platform "linux/$ARCH" --output artifacts/release-candidate
          python -m scripts.release.candidate combine "artifacts/release-candidate/backend-$ARCH.candidate.json" "artifacts/release-candidate/frontend-$ARCH.candidate.json" --platform "linux/$ARCH" --output "artifacts/release-candidate/candidate-$ARCH.json"
          python -m scripts.release.candidate load "artifacts/release-candidate/candidate-$ARCH.json"
      - name: Validate exact imported payloads
        env:
          ARCH: ${{ matrix.architecture }}
        run: python -m scripts.release.validate "artifacts/release-candidate/candidate-$ARCH.json" --architecture "$ARCH"
      - name: Preserve validated platform candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.architecture }}
          path: |
            artifacts/release-candidate/*.oci.tar
            artifacts/release-candidate/candidate-*.json
            artifacts/release-candidate/validation-*/*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  candidate:
    needs: build-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: candidate-${{ github.sha }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: artifacts/release-candidate
      - name: Require both validated service pairs
        run: |
          python -m scripts.release.candidate combine artifacts/release-candidate/candidate-amd64.json artifacts/release-candidate/candidate-arm64.json --output artifacts/release-candidate/candidate.json
          python -c "from scripts.release.github import successful_images; from launcher.termux.payload import read_manifest; successful_images(read_manifest(__import__('pathlib').Path('artifacts/release-candidate/candidate.json')))"
      - name: Preserve complete validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/*.oci.tar
            artifacts/release-candidate/candidate.json
            artifacts/release-candidate/validation-*/*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
