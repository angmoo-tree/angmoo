name: Windows Advisory

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-advisory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-local-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse PowerShell and verify synthetic DPAPI round-trip
        shell: powershell
        run: ./scripts/ci/windows_local_smoke.ps1
