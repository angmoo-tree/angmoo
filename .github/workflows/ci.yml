name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "Validation scope / 검증 범위 (full for release candidates)"
        type: choice
        options: [full, auto]
        default: full
        required: true
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      backend_profile: ${{ steps.select.outputs.backend_profile }}
      windows: ${{ steps.select.outputs.windows }}
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      local_core_smoke: ${{ steps.select.outputs.local_core_smoke }}
      local_autonomy_smoke: ${{ steps.select.outputs.local_autonomy_smoke }}
      local_full_graph: ${{ steps.select.outputs.local_full_graph }}
      embedded_data_migration: ${{ steps.select.outputs.embedded_data_migration }}
      tauri_windows: ${{ steps.select.outputs.tauri_windows }}
      windows_installer: ${{ steps.select.outputs.windows_installer }}
      windows_native: ${{ steps.select.outputs.windows_native }}
      tauri_windows_host_dev: ${{ steps.select.outputs.tauri_windows_host_dev }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: select
      name: Classify actual changed paths
      run: python scripts/ci/impact.py

  backend-preflight:
    needs: [impact]
    if: needs.impact.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Keep baseline, model, inventory and route/license gates before every partition.
    timeout-minutes: 75
    env:
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
      APP_ENV: test
      APP_SECRET: synthetic-ci-${{ github.repository_id }}-${{ github.run_id }}
      DATABASE_URL: sqlite+pysqlite:///./.ci/angmoo.sqlite3
      LADYBUG_DATABASE_ROOT: ./.ci/graph
      GRAPH_PROVIDER: ladybug
      LOCAL_RUNTIME_COMPONENT_MODE: in_process
      AGENT_ACTIVITY_ENGINE: langgraph
      SERVER_LLM_ENGINE: direct
      RESIDENT_TICK_SCHEDULER_ENABLED: "false"
      POST_IMAGE_JOB_WORKER_ENABLED: "false"
      POLLINATIONS_SERVICE_IMAGE_ENABLED: "false"
      CREDENTIAL_ENCRYPTION_PROVIDER: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Backend preservation tests read the immutable committed checkpoint.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Build pinned Vec1 for native hybrid regression
        run: |
          uv run --project backend python scripts/build_vec1.py --output "$RUNNER_TEMP/angmoo-test-vec1" --source-cache-dir "$RUNNER_TEMP/angmoo-vec1-sources"
          echo "ANGMOO_TEST_VEC1_EXTENSION=$RUNNER_TEMP/angmoo-test-vec1/vec1.so" >> "$GITHUB_ENV"
      - name: Record backend test checkout identity
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          git = lambda *args: subprocess.check_output(["git", *args], text=True).strip()
          result = {
              "source_sha": os.environ["TEST_SOURCE_SHA"],
              "checkout_sha": git("rev-parse", "HEAD"),
              "checkout_tree": git("rev-parse", "HEAD^{tree}"),
              "event_sha": os.environ["GITHUB_SHA"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "python": platform.python_version(),
              "uv": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "lock_sha256": hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest(),
          }
          Path(".ci").mkdir(exist_ok=True)
          Path(".ci/backend-test-identity.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Compile and materialize the embedded baseline
        run: |
          uv run python -m compileall -q app
          mkdir -p ./.ci
          uv run python -m app.runtime.contributor_backend \
            --data-root ./.ci/contributor \
            --diagnostics > ./.ci/contributor-status.json
          python -c "import json; p=json.load(open('./.ci/contributor-status.json', encoding='utf-8')); assert p['runtime_profile']=='CONTRIBUTOR_EMBEDDED' and p['persistence_provider']=='sqlite' and p['graph_provider']=='ladybug'"
        working-directory: backend
      - name: Verify current checkout selection
        run: python scripts/ci/check_ci_selection.py
      - name: Verify L4 P5-P7 parity and ownership inventory
        run: uv run python ../scripts/ci/generate_l4_pr_a_inventory.py --check
        working-directory: backend
      - name: Verify Memory batch runtime and frozen predecessor inventory
        run: uv run python ../scripts/ci/generate_p8_l_r_memory_batch_inventory.py --check
        working-directory: backend
      - name: Verify route and project contracts
        run: |
          uv run python ../scripts/generate_public_route_inventory.py --check
          uv run python ../scripts/check_project_license.py --repo-root .. --policy ../security/license_policy.json
        working-directory: backend
      - name: Preserve backend preflight identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            backend/.ci/backend-test-identity.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Share verified pinned sources with partitions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vec1-sources-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/angmoo-vec1-sources/sha256-8571bb4f77f9547d11ad11e2f72e0de7d3b2ab44e7930151998bce9377ed4b86.source-v1
            ${{ runner.temp }}/angmoo-vec1-sources/sha256-bf3733d7c71b3ab0f6fd8a9ea0052ad87fa037d94333e14ce09878ba3492c3b0.source-v1
          if-no-files-found: error
          retention-days: 3

  backend-tests:
    needs: [impact, backend-preflight]
    if: needs.impact.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # At 7bcc22bb the serial suite timed out at 75%, including many completed
    # failures and costly actual-Git preservation negatives. Keep every node
    # and the same timeout; isolate four deterministic full-corpus partitions.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
      APP_ENV: test
      APP_SECRET: synthetic-ci-${{ github.repository_id }}-${{ github.run_id }}-${{ matrix.shard }}
      DATABASE_URL: sqlite+pysqlite:///./.ci/angmoo.sqlite3
      LADYBUG_DATABASE_ROOT: ./.ci/graph
      GRAPH_PROVIDER: ladybug
      LOCAL_RUNTIME_COMPONENT_MODE: in_process
      AGENT_ACTIVITY_ENGINE: langgraph
      SERVER_LLM_ENGINE: direct
      RESIDENT_TICK_SCHEDULER_ENABLED: "false"
      POST_IMAGE_JOB_WORKER_ENABLED: "false"
      POLLINATIONS_SERVICE_IMAGE_ENABLED: "false"
      CREDENTIAL_ENCRYPTION_PROVIDER: local
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Verify current checkout selection
        run: python scripts/ci/check_ci_selection.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vec1-sources-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/angmoo-vec1-sources
      - name: Build pinned Vec1 for native hybrid regression
        run: |
          uv run --project backend python scripts/build_vec1.py --output "$RUNNER_TEMP/angmoo-test-vec1" --source-cache-dir "$RUNNER_TEMP/angmoo-vec1-sources"
          echo "ANGMOO_TEST_VEC1_EXTENSION=$RUNNER_TEMP/angmoo-test-vec1/vec1.so" >> "$GITHUB_ENV"
      - name: Run complete backend corpus partition with durable progress
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: backend
        run: uv run python ../scripts/ci/run_backend_shard.py --index "${{ matrix.shard }}" --source-sha "$TEST_SOURCE_SHA" --impact-plan ../.ci/impact.json
      - name: Preserve every partition result and interruption progress
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-tests-${{ github.sha }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            backend/.ci/backend-junit.xml
            backend/.ci/backend-test-identity.json
            backend/.ci/backend-shard-report.json
            backend/.ci/backend-shard-events.jsonl
          include-hidden-files: true
          if-no-files-found: error

  backend:
    if: always()
    needs:
    - impact
    - backend-preflight
    - backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify required results or explicit N/A
      run: python scripts/ci/gate.py --gate backend
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      if: needs.impact.outputs.backend == 'true'
      with:
        pattern: backend-tests-${{ github.sha }}-${{ github.run_attempt }}-shard-*
        path: .ci/backend-shard-reports
    - name: Verify selected suite and exact partition union
      if: needs.impact.outputs.backend == 'true'
      env:
        TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python scripts/ci/check_backend_shards.py --directory .ci/backend-shard-reports --source-sha "$TEST_SOURCE_SHA" --checkout-sha "$GITHUB_SHA" --impact-plan .ci/impact.json
    - name: Preserve verified aggregate coverage
      if: success() && needs.impact.outputs.backend == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: backend-coverage-${{ github.sha }}-${{ github.run_attempt }}
        path: .ci/backend-shard-reports/backend-shard-coverage.json
        include-hidden-files: true
        if-no-files-found: error

  tauri-windows:
    needs: [impact]
    if: needs.impact.outputs.tauri_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install pinned Tauri CLI
        run: npm ci --ignore-scripts
        working-directory: desktop
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.8"
          enable-cache: false
      - name: Install pinned product sidecar build environment
        shell: pwsh
        working-directory: backend
        run: |
          uv python install 3.13.12
          uv sync --frozen --python 3.13.12
          uv pip install --python .venv\Scripts\python.exe PyInstaller==6.16.0
      - name: Package and attest the product sidecar
        run: npm run build:sidecar
        working-directory: desktop
      - name: Verify pinned Rust product-window contracts
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Link Windows Tauri static product shell
        run: npm run build:shell
        working-directory: desktop

  frontend-work:
    needs: [impact]
    if: needs.impact.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Identity parity reads the pinned pre-extraction source.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install locked browser-test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: browser-tests
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked isolated upload-test backend
        run: uv sync --frozen
        working-directory: backend
      - name: Record browser test checkout identity
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const result = {
            source_sha: process.env.TEST_SOURCE_SHA,
            checkout_sha: git('rev-parse', 'HEAD'),
            checkout_tree: git('rev-parse', 'HEAD^{tree}'),
            event_sha: process.env.GITHUB_SHA,
            event_name: process.env.GITHUB_EVENT_NAME,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version,
            pnpm: execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim(),
            locks: Object.fromEntries(['frontend/pnpm-lock.yaml', 'browser-tests/pnpm-lock.yaml'].map(file =>
              [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')])),
          };
          fs.mkdirSync('browser-tests/.ci', { recursive: true });
          fs.writeFileSync('browser-tests/.ci/browser-test-identity.json', JSON.stringify(result, null, 2) + '\n');
          JS
      - name: Lint
        run: pnpm lint
        working-directory: frontend
      - name: Verify patched Next root discovery and active link rule
        run: pnpm test:next-root-glob
        working-directory: frontend
      - name: Typecheck
        run: pnpm typecheck
        working-directory: frontend
      # Build before any server fixture writes generated development files.
      # CI fixtures below execute this build with the shared production launcher.
      - name: Build Local OSS profile offline
        env:
          NEXT_PUBLIC_EXPERIMENTAL_IMAGE_ENABLED: "false"
        run: pnpm build
        working-directory: frontend
      - name: Verify World Package proxy capabilities
        run: pnpm test:world-package-proxy
        working-directory: frontend
      - name: Verify character card proxy request limits
        run: pnpm test:character-card-proxy
        working-directory: frontend
      - name: Verify Identity request and session parity
        run: node scripts/test-identity-session.mjs
        working-directory: frontend
      - name: Character request and session preservation
        run: node scripts/test-character-session.mjs
        working-directory: frontend
      - name: Character dashboard state consolidation parity
        run: node scripts/test-character-state-parity.mjs
        working-directory: frontend
      - name: Social endpoint and transport preservation
        run: node scripts/test-social-requests.mjs
        working-directory: frontend
      - name: Feature validation messages and transport parity
        run: node scripts/test-feature-error-parity.mjs
        working-directory: frontend
      - name: Install Chromium for product-shell smoke
        shell: bash
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          set -euo pipefail

          # GitHub's Azure Ubuntu mirror can accept the connection and then
          # stop serving package indexes. Use the canonical archive mirror
          # and bound every network attempt so this required check fails
          # clearly instead of occupying the runner until the job timeout.
          while IFS= read -r source_file; do
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "$source_file"
          done < <(
            sudo grep -rl \
              'http://azure.archive.ubuntu.com/ubuntu' \
              /etc/apt/sources.list \
              /etc/apt/sources.list.d \
              /etc/apt/apt-mirrors.txt \
              2>/dev/null || true
          )

          sudo tee /etc/apt/apt.conf.d/99angmoo-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

          for attempt in 1 2; do
            echo "Playwright Chromium install attempt ${attempt}/2"
            if timeout --signal=TERM --kill-after=15s 4m \
              pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi

            if [[ "$attempt" -lt 2 ]]; then
              echo "Chromium install attempt ${attempt} failed or timed out; retrying."
              sleep 10
            fi
          done

          echo "Chromium installation failed after two bounded attempts."
          exit 1
        working-directory: browser-tests
      - name: Run product-shell browser smoke
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/web.xml
        run: pnpm exec playwright test --config playwright.continuity.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Verify UI-E Local Settings fail-closed states
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/settings.xml
        run: pnpm test:ui-e-local-settings --reporter=github,junit
        working-directory: browser-tests
      - name: Verify shared character creator flows in Next
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/creator-next.xml
        run: pnpm exec playwright test --config playwright.creator.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Verify synthetic card upload through the actual Next proxy
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/card-upload.xml
        run: pnpm exec playwright test --config playwright.card-upload.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Build Tauri static frontend profile
        env:
          NEXT_PUBLIC_EXPERIMENTAL_IMAGE_ENABLED: "false"
        run: pnpm build:static
        working-directory: frontend
      - name: Verify shared SNS and Chat image flows in Next and static
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/image-integration.xml
        run: pnpm exec playwright test --config playwright.image-integration.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Verify daily preparation in production Next
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/daily-next.xml
        run: pnpm exec playwright test --config playwright.daily.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Verify shared character creator flows in static
        env:
          ANGMOO_CREATOR_STATIC: "1"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/creator-static.xml
        run: pnpm exec playwright test --config playwright.creator.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Verify shared daily preparation in static
        env:
          ANGMOO_DAILY_STATIC: "1"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/daily-static.xml
        run: pnpm exec playwright test --config playwright.daily.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Verify Tauri static direct-open routes
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/static.xml
        run: pnpm exec playwright test --config playwright.continuity-static.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Verify shared Memory and native lifecycle boundaries
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .ci/lifecycle.xml
        run: pnpm exec playwright test --config playwright.refactor-lifecycle.config.ts --reporter=github,junit
        working-directory: browser-tests
      - name: Verify UI-F production and static product visual corpus
        shell: bash
        run: |
          docker run --rm --ipc=host \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work" \
            --workdir /work/browser-tests \
            --env CI=true \
            --env PLAYWRIGHT_JUNIT_OUTPUT_FILE=/work/browser-tests/.ci/visual.xml \
            mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e \
            node ./node_modules/@playwright/test/cli.js test \
              --config=playwright.visual.config.ts --reporter=github,junit
      - name: Reject remote build-time dependencies
        shell: bash
        run: |
          if grep -R -n 'next/font' frontend/src ||
             grep -R -n -E 'url\([^)]*https?://' frontend/src; then
            echo "Remote build-time frontend dependency found"
            exit 1
          fi
      - name: Preserve browser test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            browser-tests/.ci/web.xml
            browser-tests/.ci/settings.xml
            browser-tests/.ci/static.xml
            browser-tests/.ci/lifecycle.xml
            browser-tests/.ci/visual.xml
            browser-tests/.ci/creator-next.xml
            browser-tests/.ci/creator-static.xml
            browser-tests/.ci/card-upload.xml
            browser-tests/.ci/image-integration.xml
            artifacts/image-integration/browser/**/test-failed-*.png
            artifacts/image-integration/browser/**/trace.zip
            browser-tests/.ci/daily-next.xml
            browser-tests/.ci/daily-static.xml
            browser-tests/.ci/browser-test-identity.json
          include-hidden-files: true
          if-no-files-found: error

  frontend:
    if: always()
    needs:
    - impact
    - frontend-work
    - tauri-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify required results or explicit N/A
      run: python scripts/ci/gate.py --gate frontend

  embedded-data-migration-work:
    needs: [impact]
    if: needs.impact.outputs.embedded_data_migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install frozen SQLite-only runtime dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Reject schema drift without versioned immutable manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python ../scripts/ci/check_embedded_data_migration_contract.py
        working-directory: backend
      - name: Verify SQLite canonical and LadybugDB projection upgrade lifecycle
        run: >-
          uv run python -m pytest -q
          tests/test_embedded_data_migration_contract.py
          tests/test_embedded_data_migration.py
          tests/test_l3_er2_sqlite_canonical_adapter.py
          tests/test_l3_er3_ladybug_projection.py
          tests/test_l3_er3_graph_query_parity.py
          tests/test_l3_er6_release_candidate.py
          tests/test_l3_er6_localappdata_migration.py
          tests/test_l3_er7_runtime_composition.py
        working-directory: backend
  embedded-data-migration:
    if: always()
    needs:
    - impact
    - embedded-data-migration-work
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify required results or explicit N/A
      run: python scripts/ci/gate.py --gate embedded-data-migration
