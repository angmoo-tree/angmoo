name: Release Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/angmoo-tree/angmoo-backend
  FRONTEND_IMAGE: ghcr.io/angmoo-tree/angmoo-frontend

jobs:
  publish-ghcr:
    if: github.repository == 'angmoo-tree/angmoo'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and source versions
        run: python scripts/ci/check_release_tag.py --tag "$GITHUB_REF_NAME"
      - name: Re-run image, vulnerability, SBOM, and clean-clone Gate
        env:
          ANGMOO_IMAGE_VERSION: ${{ github.ref_name }}
          ANGMOO_CI_PROJECT: angmoo-release-${{ github.run_id }}
        run: bash scripts/ci/run_container_gate.sh
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish backend image
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.backend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Attest backend image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Build and publish frontend image
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.frontend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Attest frontend image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image digests
        shell: bash
        run: |
          {
            echo "## GHCR release images"
            echo
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- backend: \`${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}\`"
            echo "- frontend: \`${FRONTEND_IMAGE}@${{ steps.frontend.outputs.digest }}\`"
            echo "- supported platform: \`linux/amd64\`"
          } >>"$GITHUB_STEP_SUMMARY"
