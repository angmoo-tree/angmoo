name: Release Images
on:
  push:
    tags:
      - "release-v*.*.*"
permissions:
  contents: read
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-ghcr:
    if: github.repository == 'angmoo-tree/angmoo'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact official tag
        run: python scripts/ci/check_release_tag.py --tag "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote verified original OCI payloads
        id: promote
        run: python -m scripts.release.promote --source "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --output artifacts/image-publication
      - name: Attest backend index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/angmoo-tree/angmoo-backend
          subject-digest: ${{ steps.promote.outputs.backend_digest }}
          push-to-registry: true
      - name: Attest frontend index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/angmoo-tree/angmoo-frontend
          subject-digest: ${{ steps.promote.outputs.frontend_digest }}
          push-to-registry: true
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/image-publication/image-publication.json
          if-no-files-found: error
          retention-days: 30
