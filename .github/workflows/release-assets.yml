name: Release Common Assets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-assets-${{ github.sha }}
  cancel-in-progress: false
jobs:
  assets:
    if: github.repository == 'angmoo-tree/angmoo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.12.5
          enable-cache: false
      - name: Install locked source packaging dependencies
        run: uv sync --frozen --project backend
      - name: Package matching sources and notices without an installer
        run: uv run --frozen --project backend python -m scripts.release.assets --output artifacts/release-assets --cache "$RUNNER_TEMP/angmoo-postgresql-sources"
      - name: Preserve exact common release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/release-assets/angmoo-postgresql-sources.zip
            artifacts/release-assets/THIRD_PARTY_NOTICES.md
            artifacts/release-assets/LICENSE
            artifacts/release-assets/release-assets.json
          if-no-files-found: error
          retention-days: 30
