name: Local Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

jobs:
  local-core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - name: Install locked dependencies
        shell: bash
        run: |
          uv sync --frozen --directory backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Run embedded Local OSS vertical smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            [[ -n "${backend_pid:-}" ]] && kill "$backend_pid" >/dev/null 2>&1 || true
            [[ -n "${frontend_pid:-}" ]] && kill "$frontend_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          data_root="$RUNNER_TEMP/angmoo-contributor"
          uv run --directory backend python -m app.runtime.contributor_backend \
            --data-root "$data_root" \
            --host 127.0.0.1 \
            --port 8080 \
            --frontend-origin http://127.0.0.1:3000 \
            >"$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          pnpm --dir frontend build
          pnpm --dir frontend exec next start -H 127.0.0.1 -p 3000 \
            >"$RUNNER_TEMP/frontend.log" 2>&1 &
          frontend_pid=$!
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/health >/dev/null && break
            sleep 1
          done
          health="$(curl --fail --silent http://127.0.0.1:8080/health)"
          python -c "import json,sys; p=json.loads(sys.argv[1]); assert p['status']=='ok' and p['persistence']=='sqlite' and p['graph']=='ladybug'; assert set(p['components'])=={'scheduler','projector'}" "$health"
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          uv run --directory backend python ../scripts/quickstart_smoke.py \
            --backend-url http://127.0.0.1:8080 \
            --frontend-url http://127.0.0.1:3000 \
            --bootstrap-local-session \
            --bootstrap-data-root "$data_root"
          test -f "$data_root/canonical/generations/contributor-v1/angmoo.sqlite3"
          test -f "$data_root/secrets/app-secret"
          if grep -E 'https?://(generativelanguage|api\.pollinations|api\.replicate)' "$RUNNER_TEMP/backend.log"; then
            echo "Provider request found in Local OSS smoke"
            exit 1
          fi

      - name: Run required container supply-chain and clean-clone Gate
        shell: bash
        env:
          ANGMOO_CI_PROJECT: angmoo-pr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          clean_clone="$RUNNER_TEMP/angmoo-clean-clone-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$clean_clone"
          git clone --filter=blob:none --no-checkout \
            "$GITHUB_SERVER_URL/$SOURCE_REPOSITORY.git" "$clean_clone"
          git -C "$clean_clone" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$clean_clone" rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C "$clean_clone" status --porcelain --untracked-files=all)"
          (
            cd "$clean_clone"
            ANGMOO_SOURCE_SHA="$SOURCE_SHA" \
              ANGMOO_CI_PROJECT="$ANGMOO_CI_PROJECT" \
              bash scripts/ci/run_container_gate.sh
          )

  local-autonomy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      APP_SECRET: synthetic-ci-${{ github.repository_id }}-${{ github.run_id }}
      DATABASE_URL: sqlite+pysqlite:///./.ci/autonomy.sqlite3
      LADYBUG_DATABASE_ROOT: ./.ci/autonomy-graph
      GRAPH_PROVIDER: ladybug
      LOCAL_RUNTIME_COMPONENT_MODE: in_process
      RESIDENT_TICK_SCHEDULER_ENABLED: "false"
      POST_IMAGE_JOB_WORKER_ENABLED: "false"
      POLLINATIONS_SERVICE_IMAGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Run provider-free P1-P6 and L3 representative scenarios
        working-directory: backend
        run: |
          uv run python -m pytest -q \
            tests/test_world_foundation.py \
            tests/worlds/test_definition_contract.py \
            tests/worlds/test_creator_routes.py \
            tests/world_characters/test_setup_service.py \
            tests/routines/test_daily_activity_runtime.py \
            tests/test_routine_post_runtime.py \
            tests/world_characters/test_owner_identity.py \
            tests/test_l3_owner_manual_social_inbox.py \
            tests/test_l3_domain_boundary_map.py \
            tests/test_l3_closeout_contract.py \
            tests/world_packages/test_v1_contract.py \
            tests/world_packages/test_export.py \
            tests/world_packages/test_preview.py \
            tests/world_packages/test_import_commit.py \
            tests/world_packages/test_ui_contract.py \
            tests/world_packages/test_closeout.py \
            tests/world_packages/test_closeout_contract.py \
            tests/test_l4_pr_f_closeout_contract.py \
            tests/test_feed_reaction_intent.py \
            tests/test_world_feed_search.py \
            tests/test_social_event_runtime.py \
            tests/test_activity_proposal_runtime.py

  local-full-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: test
      APP_SECRET: synthetic-ci-${{ github.repository_id }}-${{ github.run_id }}
      DATABASE_URL: sqlite+pysqlite:///./.ci/graph.sqlite3
      LADYBUG_DATABASE_ROOT: ./.ci/graph
      GRAPH_PROVIDER: ladybug
      LOCAL_RUNTIME_COMPONENT_MODE: in_process
      GRAPH_PROJECTION_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked embedded dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run SQLite and LadybugDB graph, replay, and isolation scenarios
        working-directory: backend
        run: |
          uv run python -m pytest -q \
            tests/test_l3_er2_sqlite_concurrency.py \
            tests/test_l3_er3_ladybug_projection.py \
            tests/test_l3_er3_graph_query_parity.py \
            tests/test_graph_projection_commands.py \
            tests/test_graph_projection_metrics.py \
            tests/test_graph_projection_replay.py \
            tests/test_graph_projection_worker.py \
            tests/test_relationship_graph_api.py \
            tests/test_relationship_graph_repository.py
