name: Docker Migration Tools
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact main ancestor for the historical 0.1.3 to 0.1.4 Docker tool
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: docker-migration-tools-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  tools:
    if: github.repository == 'angmoo-tree/angmoo' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: tooling
      - name: Verify historical product before checkout
        working-directory: tooling
        run: python -c "import os; from scripts.release.github import GitHub; GitHub().main_source(os.environ['PRODUCT_SOURCE'])"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source }}
          path: product
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.12.5
          enable-cache: false
      - name: Package only the Docker host tool, without NSIS or native runtime
        working-directory: product
        shell: pwsh
        run: |
          uv sync --frozen --project backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --project backend python -c "from scripts.ci.check_release_tag import expected_release_tag; from pathlib import Path; assert expected_release_tag(Path.cwd()) == 'release-v0.1.4'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --project backend python scripts/build_docker_migrator.py --output ../artifacts/docker-tools --work "$env:RUNNER_TEMP/angmoo-docker-tools" --source $env:PRODUCT_SOURCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve source-bound Docker tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docker-migration-tools-${{ inputs.source }}-${{ github.run_attempt }}
          path: |
            artifacts/docker-tools/angmoo-migrate.exe
            artifacts/docker-tools/angmoo-migrate.py
            artifacts/docker-tools/angmoo-migration-tools.json
          if-no-files-found: error
          retention-days: 30
