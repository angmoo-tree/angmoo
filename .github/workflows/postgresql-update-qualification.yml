name: PostgreSQL Update Qualification
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact already-built main product source
        type: string
        required: true
      candidate_run:
        description: Validated six-payload Container Candidate run
        type: string
        required: true
      candidate_attempt:
        description: Container Candidate attempt
        type: string
        required: true
      candidate_artifact:
        description: Complete Container Candidate artifact ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: postgresql-update-qualification-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  native-update:
    if: github.repository == 'angmoo-tree/angmoo' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_SOURCE: ${{ inputs.source }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
      CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
      NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Qualify official PostgreSQL update and actual restore
        run: |
          python -m scripts.ci.qualify_postgresql_update \
            --source "$PRODUCT_SOURCE" --candidate-run "$CANDIDATE_RUN" \
            --candidate-attempt "$CANDIDATE_ATTEMPT" --candidate-artifact "$CANDIDATE_ARTIFACT" \
            --architecture "$NATIVE_ARCHITECTURE" --work-root "$RUNNER_TEMP/angmoo-pg-update"
      - name: Preserve only sanitized qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: postgresql-update-${{ matrix.architecture }}-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/angmoo-pg-update/records/source.json
            ${{ runner.temp }}/angmoo-pg-update/records/qualification.json
          if-no-files-found: error
          retention-days: 30
