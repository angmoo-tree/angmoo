name: Windows Installer

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  release-candidate:
    name: release-candidate
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked release-candidate dependencies
        shell: pwsh
        run: |
          uv python install 3.13.12
          uv sync --frozen --directory backend --python 3.13.12
          uv pip install --python backend\.venv\Scripts\python.exe PyInstaller==6.16.0
          pnpm --dir frontend install --frozen-lockfile
          npm ci --ignore-scripts --prefix desktop
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.1 --path desktop\src-tauri
      - name: Verify ER6 migration, restore, and installer contracts
        shell: pwsh
        run: |
          Push-Location backend
          .\.venv\Scripts\python.exe -m pytest -q `
            tests\test_embedded_data_migration_contract.py `
            tests\test_embedded_data_migration.py `
            tests\test_installer_update.py `
            tests\test_l3_er6_release_candidate.py `
            tests\test_l3_er6_localappdata_closeout.py `
            tests\test_l3_er6_interactive_remove_data.py `
            tests\test_l3_er5_desktop_sidecar_security.py `
            tests\test_l3_er3_ladybug_projection.py `
            tests\test_l3_er3_graph_query_parity.py `
            tests\test_l3_er4_single_backend_runtime.py `
            tests\test_l3_5_world_package_ui_contract.py `
            tests\test_l3_5_world_package_closeout_contract.py
          Pop-Location
          backend\.venv\Scripts\python.exe scripts\ci\check_desktop_installer_contract.py
          .\desktop\scripts\test-installer-payload-verifier.ps1
          .\desktop\scripts\test-installer-payload-transaction.ps1
          backend\.venv\Scripts\python.exe scripts\ci\check_er6_desktop_supply_chain.py `
            --evidence .codex-temp\er6-supply-chain-audit.json
      - name: Build synthetic legacy LocalAppData lifecycle fixture
        shell: pwsh
        run: |
          $fixtureRoot = '.codex-temp\er6-localappdata-lifecycle\legacy'
          backend\.venv\Scripts\python.exe `
            scripts\ci\build_er6_localappdata_lifecycle_fixture.py `
            --output-root $fixtureRoot
          $archive = '.codex-temp\er6-localappdata-lifecycle\er6-localappdata-lifecycle.zip'
          Compress-Archive -Path "$fixtureRoot\*" -DestinationPath $archive
      - name: Audit locked runtime dependencies
        shell: pwsh
        run: |
          uv audit --project backend --locked
          pnpm --dir frontend audit --prod --audit-level high
      - name: Build NSIS Setup and MSI
        shell: pwsh
        working-directory: desktop
        run: npm run build:installer
      - name: Build Defender trigger matrix binaries
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = (Resolve-Path 'desktop\src-tauri\target').Path
          cargo build --manifest-path desktop\security\defender-matrix\Cargo.toml `
            --release --locked --bins
      - name: Run pre-install Defender trigger matrix
        shell: pwsh
        run: |
          $release = 'desktop\src-tauri\target\release'
          $installer = Get-ChildItem "$release\bundle\nsis" -Filter '*setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer is missing for Defender matrix' }
          .\scripts\ci\run_er6_defender_trigger_matrix.ps1 `
            -MinimalHost "$release\angmoo-defender-matrix-host.exe" `
            -StubHost "$release\angmoo-defender-matrix-stub-host.exe" `
            -RealSidecarHost "$release\angmoo-defender-matrix-real-host.exe" `
            -StubSidecar "$release\angmoo-defender-matrix-stub.exe" `
            -ActualHost "$release\angmoo-desktop.exe" `
            -ActualSidecar "$release\angmoo-sidecar.exe" `
            -Installer $installer.FullName `
            -OutputRoot '.codex-temp\er6-defender-trigger-matrix' `
            -FailOnDetection
      - name: Verify packaged executables do not open consoles
        shell: pwsh
        run: |
          $release = 'desktop\src-tauri\target\release'
          $desktop = Join-Path $release 'angmoo-desktop.exe'
          $sidecar = 'desktop\src-tauri\binaries\angmoo-sidecar-x86_64-pc-windows-msvc.exe'
          backend\.venv\Scripts\python.exe scripts\ci\check_windows_gui_subsystems.py `
            $desktop $sidecar
      - name: Reject private migration artifacts
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem desktop\src-tauri\target\release\bundle -Recurse -File |
            Where-Object { $_.Name -in @('release-candidate-backup.json', 'synthetic-fixture.json', 'app-secret') }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Private artifact refused: $($_.FullName)" }
            exit 1
          }
      - name: Build checksums, SPDX SBOM, provenance, and notices
        shell: pwsh
        run: |
          backend\.venv\Scripts\python.exe scripts\ci\build_desktop_release_metadata.py `
            --bundle-root desktop\src-tauri\target\release\bundle `
            --output-root .codex-temp\er6-release-metadata `
            --version 0.4.0-1 `
            --commit $env:GITHUB_SHA
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: angmoo-windows-installer-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            .codex-temp/er6-release-metadata/SHA256SUMS
            .codex-temp/er6-release-metadata/angmoo-installer.spdx.json
            .codex-temp/er6-release-metadata/angmoo-installer.provenance.json
            .codex-temp/er6-release-metadata/THIRD_PARTY_NOTICES.md
            .codex-temp/er6-release-metadata/LICENSE
            .codex-temp/er6-supply-chain-audit.json
            .codex-temp/er6-defender-trigger-matrix/er6-defender-trigger-matrix.json
            .codex-temp/er6-localappdata-lifecycle/er6-localappdata-lifecycle.zip
      - name: Attest Windows installers
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  installed-runtime-smoke:
    name: installed-runtime-smoke
    needs: release-candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: angmoo-windows-installer-${{ github.sha }}
          path: ${{ runner.temp }}/angmoo-installer
      - name: Verify installer digests
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'angmoo-installer'
          $sums = Get-Content (Get-ChildItem $root -Filter SHA256SUMS -Recurse | Select-Object -First 1)
          foreach ($line in $sums) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum line: $line" }
            $file = Get-ChildItem $root -Filter $Matches[2] -Recurse | Select-Object -First 1
            if (-not $file) { throw "Artifact is missing: $($Matches[2])" }
            if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) {
              throw "Artifact digest mismatch: $($Matches[2])"
            }
          }
      - name: Defender scan NSIS installer
        shell: pwsh
        run: |
          $detectionBaseline = Join-Path $env:RUNNER_TEMP 'angmoo-defender-detection-baseline.json'
          $knownDetectionIds = @(
            Get-MpThreatDetection -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty DetectionID
          )
          ConvertTo-Json -InputObject $knownDetectionIds |
            Set-Content -LiteralPath $detectionBaseline -Encoding utf8
          function Assert-NoActiveDefenderDetection([string]$Stage) {
            $active = @(Get-MpThreat -ErrorAction Stop | Where-Object { $_.IsActive })
            if ($active.Count -gt 0) {
              $active | ConvertTo-Json -Depth 5 | Write-Error
              throw "Defender active detection at $Stage"
            }
          }
          function Assert-NoNewDefenderDetection([string]$Stage) {
            $known = @(Get-Content -LiteralPath $detectionBaseline -Raw | ConvertFrom-Json)
            $new = @(Get-MpThreatDetection -ErrorAction SilentlyContinue |
              Where-Object DetectionID -notin $known)
            if ($new.Count -gt 0) {
              $new | Select-Object DetectionID, ThreatID, InitialDetectionTime, CleaningActionID, ActionSuccess |
                ConvertTo-Json -Depth 5 | Write-Error
              throw "Defender created a new detection at $Stage"
            }
          }
          $installer = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'angmoo-installer') -Filter '*setup*.exe' -Recurse |
            Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'angmoo-installer') -Filter '*.exe' -Recurse |
              Select-Object -First 1
          }
          if (-not $installer) { throw 'NSIS installer is missing' }
          $beforeHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName
          if (-not (Test-Path -LiteralPath $installer.FullName)) {
            throw 'Defender removed or quarantined the NSIS installer'
          }
          if ((Get-FileHash $installer.FullName -Algorithm SHA256).Hash -ne $beforeHash) {
            throw 'NSIS installer changed during Defender scan'
          }
          Assert-NoActiveDefenderDetection 'installer_preinstall_scan'
          Assert-NoNewDefenderDetection 'installer_preinstall_scan'
      - name: Install and run without developer runtimes
        shell: pwsh
        run: |
          $detectionBaseline = Join-Path $env:RUNNER_TEMP 'angmoo-defender-detection-baseline.json'
          function Assert-NoActiveDefenderDetection([string]$Stage) {
            $active = @(Get-MpThreat -ErrorAction Stop | Where-Object { $_.IsActive })
            if ($active.Count -gt 0) {
              $active | ConvertTo-Json -Depth 5 | Write-Error
              throw "Defender active detection at $Stage"
            }
          }
          function Assert-NoNewDefenderDetection([string]$Stage) {
            $known = @(Get-Content -LiteralPath $detectionBaseline -Raw | ConvertFrom-Json)
            $new = @(Get-MpThreatDetection -ErrorAction SilentlyContinue |
              Where-Object DetectionID -notin $known)
            if ($new.Count -gt 0) {
              $new | Select-Object DetectionID, ThreatID, InitialDetectionTime, CleaningActionID, ActionSuccess |
                ConvertTo-Json -Depth 5 | Write-Error
              throw "Defender created a new detection at $Stage"
            }
          }
          function Get-InstallFileManifest([string]$Root) {
            $manifest = @{}
            Get-ChildItem -LiteralPath $Root -Recurse -File | ForEach-Object {
              $manifest[$_.FullName] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            }
            return $manifest
          }
          function Assert-InstallFileManifest([hashtable]$Manifest, [string]$Stage) {
            foreach ($entry in $Manifest.GetEnumerator()) {
              if (-not (Test-Path -LiteralPath $entry.Key)) {
                throw "Defender removed or quarantined installed artifact at ${Stage}: $($entry.Key)"
              }
              if ((Get-FileHash $entry.Key -Algorithm SHA256).Hash -ne $entry.Value) {
                throw "Installed artifact changed at ${Stage}: $($entry.Key)"
              }
            }
          }
          function Get-StableFileHash([string]$Path, [string]$Stage) {
            $lastError = $null
            for ($attempt = 1; $attempt -le 40; $attempt++) {
              try {
                return (Get-FileHash -LiteralPath $Path -Algorithm SHA256 -ErrorAction Stop).Hash
              } catch [System.IO.IOException] {
                $lastError = $_
                Start-Sleep -Milliseconds 250
              }
            }
            throw "Timed out waiting for a stable file hash at ${Stage}: $Path ($lastError)"
          }
          function Wait-InstalledApplicationRemoved([string]$Root, [string]$Stage) {
            # NSIS completes the visible uninstaller process before its
            # self-delete helper removes the application payload. Wait for
            # that bounded, expected cleanup without weakening the assertion.
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              $remaining = Get-ChildItem $Root -Filter 'angmoo-desktop.exe' -Recurse `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $remaining) { return }
              Start-Sleep -Milliseconds 250
            }
            throw "NSIS uninstall left the installed application executable behind at ${Stage}"
          }
          function Stop-ProductWebViewProcesses(
            [string]$ProfileRoot,
            [int[]]$BaselineProcessIds,
            [string]$Stage
          ) {
            # A headless runner can force-kill the frameless Tauri host after
            # CloseMainWindow(), leaving WebView2 children alive for a short
            # time. Those processes keep the preserved profile locked and can
            # make the next Tauri setup exit before it starts the sidecar.
            # Match only WebView2 processes created by this product profile;
            # never terminate a runner/system WebView that predates Angmoo.
            $profileNeedle = $ProfileRoot.ToLowerInvariant()
            $deadline = (Get-Date).AddSeconds(20)
            do {
              $owned = @(Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ProcessId -notin $BaselineProcessIds -and
                  -not [string]::IsNullOrWhiteSpace([string]$_.CommandLine) -and
                  $_.CommandLine.ToLowerInvariant().Contains($profileNeedle)
                })
              if ($owned.Count -eq 0) { return }
              foreach ($process in $owned) {
                Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
              }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            throw "Product WebView2 profile remained locked at ${Stage}: $ProfileRoot"
          }
          $root = Join-Path $env:RUNNER_TEMP 'angmoo-installer'
          $installer = Get-ChildItem $root -Filter '*setup*.exe' -Recurse | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem $root -Filter '*.exe' -Recurse | Select-Object -First 1 }
          $fixtureArchive = Get-ChildItem $root -Filter 'er6-localappdata-lifecycle.zip' -Recurse |
            Select-Object -First 1
          if (-not $fixtureArchive) { throw 'Synthetic LocalAppData lifecycle fixture is missing' }
          $legacyRoot = Join-Path $env:LOCALAPPDATA 'com.angmoo.desktop'
          $productRoot = Join-Path $env:LOCALAPPDATA 'Angmoo'
          $installRoot = Join-Path $productRoot 'app'
          if (Test-Path -LiteralPath $legacyRoot) {
            throw "Hosted runner legacy root was not clean before fixture restore: $legacyRoot"
          }
          if (Test-Path -LiteralPath $productRoot) {
            throw "Hosted runner product root was not clean before install: $productRoot"
          }
          New-Item -ItemType Directory -Force -Path $legacyRoot | Out-Null
          Expand-Archive -LiteralPath $fixtureArchive.FullName -DestinationPath $legacyRoot
          $fixtureManifestPath = Join-Path $legacyRoot 'fixture-manifest.json'
          if (-not (Test-Path -LiteralPath $fixtureManifestPath)) {
            throw 'Synthetic LocalAppData fixture manifest is missing after restore'
          }
          $fixtureManifest = Get-Content -LiteralPath $fixtureManifestPath -Raw | ConvertFrom-Json
          if (-not $fixtureManifest.synthetic_fixture -or $fixtureManifest.contains_real_credentials) {
            throw 'Installed lifecycle refuses a personal or real-credential fixture'
          }
          # Reproduce the field layout that exposed the ER6 migration gap:
          # launcher-era DPAPI files under a lowercase product root coexist
          # with canonical preview data under com.angmoo.desktop.
          $lowercaseProductRoot = Join-Path $env:LOCALAPPDATA 'angmoo'
          $legacyLauncherSecrets = [ordered]@{
            'app-secret.dpapi' = 'synthetic-launcher-app-secret-dpapi'
            'neo4j-local-password.dpapi' = 'synthetic-neo4j-password-dpapi'
          }
          $legacyLauncherSecretHashes = @{}
          foreach ($entry in $legacyLauncherSecrets.GetEnumerator()) {
            $path = Join-Path $lowercaseProductRoot "secrets\$($entry.Key)"
            New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
            Set-Content -LiteralPath $path -Value $entry.Value -Encoding ascii -NoNewline
            $legacyLauncherSecretHashes[$entry.Key] =
              (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }
          Write-Host "Installing $($installer.FullName) into the canonical app root $installRoot"
          $install = Start-Process $installer.FullName -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(120000)) {
            Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            throw 'NSIS install timed out after 120 seconds'
          }
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          $productEntries = @(Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Directory -Force |
            Where-Object { $_.Name -ieq 'Angmoo' })
          if ($productEntries.Count -ne 1 -or $productEntries[0].Name -cne 'Angmoo') {
            throw "Installer did not canonicalize the product-root casing to Angmoo"
          }
          $productRootActualName = $productEntries[0].Name
          # Tauri's productName is "Angmoo", but the generated NSIS contract
          # installs the mainBinaryName as angmoo-desktop.exe.
          $app = Get-ChildItem $installRoot -Filter 'angmoo-desktop.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $app) { throw 'Installed angmoo-desktop.exe is missing' }
          $sidecarFile = Get-ChildItem $installRoot -Filter 'angmoo-sidecar.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $sidecarFile) { throw 'Installed angmoo-sidecar.exe is missing' }
          & (Join-Path $installRoot 'verify-installed-payload.ps1') -AppRoot $installRoot
          if ($LASTEXITCODE -ne 0) { throw 'Installed host and sidecar payload digest parity failed' }
          Write-Host 'installer_payload_digest_parity_pass:first_install'
          $payloadIdentity = Get-Content -LiteralPath (Join-Path $installRoot 'installer-payload.json') -Raw |
            ConvertFrom-Json
          if ($payloadIdentity.schema_version -ne 2) {
            throw 'Installed payload manifest did not use build identity schema 2'
          }
          if ($payloadIdentity.build_commit -ne '${{ github.sha }}') {
            throw "Installed payload build commit mismatch: $($payloadIdentity.build_commit)"
          }
          if ([string]$payloadIdentity.payload_generation -notmatch '^[0-9a-f]{64}$') {
            throw 'Installed payload generation is invalid'
          }
          foreach ($transactionRoot in @(
              (Join-Path $productRoot 'app.__install_staging__'),
              (Join-Path $productRoot 'app.__install_backup__')
            )) {
            if (Test-Path -LiteralPath $transactionRoot) {
              throw "Successful install left app transaction root: $transactionRoot"
            }
          }
          $installManifest = Get-InstallFileManifest $installRoot
          foreach ($target in @($app.FullName, $sidecarFile.FullName, $installRoot)) {
            Write-Host "Defender custom scan: $target"
            Start-MpScan -ScanType CustomScan -ScanPath $target
            Assert-InstallFileManifest $installManifest 'installed_prelaunch_scan'
            Assert-NoActiveDefenderDetection 'installed_prelaunch_scan'
            Assert-NoNewDefenderDetection 'installed_prelaunch_scan'
          }
          # Snapshot forbidden developer/server runtime processes before the
          # product starts. Comparing process IDs avoids a Win32_Process WMI
          # inventory, which can stall indefinitely on hosted Windows images.
          $forbiddenPattern = '^(python|pythonw|node|java|postgres|neo4j|docker).*'
          $forbiddenBefore = @(Get-Process -ErrorAction SilentlyContinue |
            Where-Object ProcessName -match $forbiddenPattern |
            Select-Object -ExpandProperty Id)
          $webViewBefore = @(Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Id)
          Write-Host "Launching installed product $($app.FullName)"
          $product = Start-Process $app.FullName -PassThru
          $dataRoot = $productRoot
          $endpoint = Join-Path $dataRoot 'runtime\sidecar.endpoint.json'
          $database = Join-Path $dataRoot 'canonical\generations\er6-preview-v1\angmoo.sqlite3'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and (-not (Test-Path $endpoint) -or -not (Test-Path $database))) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $endpoint)) { throw 'Installed sidecar endpoint was not created' }
          if (-not (Test-Path $database)) { throw 'Installed SQLite canonical database was not created' }
          $migrationMarkerPath = Join-Path $dataRoot 'localappdata-migration-v1.json'
          if (-not (Test-Path -LiteralPath $migrationMarkerPath)) {
            throw 'Installed runtime did not write the LocalAppData migration marker'
          }
          $migrationMarker = Get-Content -LiteralPath $migrationMarkerPath -Raw | ConvertFrom-Json
          if ($migrationMarker.status -ne 'migrated') {
            throw "Unexpected LocalAppData migration status: $($migrationMarker.status)"
          }
          if ($migrationMarker.generation -ne $fixtureManifest.generation) {
            throw 'Migrated generation does not match the synthetic fixture'
          }
          if ($migrationMarker.app_secret_sha256 -ne $fixtureManifest.app_secret_sha256) {
            throw 'Migrated APP_SECRET digest does not match the synthetic fixture'
          }
          foreach ($entry in $legacyLauncherSecrets.GetEnumerator()) {
            $path = Join-Path $dataRoot "secrets\$($entry.Key)"
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Synthesized migration lost launcher secret: $($entry.Key)"
            }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne
                $legacyLauncherSecretHashes[$entry.Key]) {
              throw "Synthesized migration changed launcher secret: $($entry.Key)"
            }
          }
          foreach ($property in $fixtureManifest.persistent_files.PSObject.Properties) {
            $relative = $property.Name -replace '/', '\'
            $source = Join-Path $legacyRoot $relative
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Legacy rollback source was changed during migration: $relative"
            }
            if ((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$property.Value) {
              throw "Legacy rollback source digest changed during migration: $relative"
            }
            if ($relative -notlike 'canonical\*') {
              $target = Join-Path $dataRoot $relative
              if (-not (Test-Path -LiteralPath $target)) {
                throw "Migrated persistent file is missing: $relative"
              }
              if ((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$property.Value) {
                throw "Migrated persistent file digest mismatch: $relative"
              }
            }
          }
          if (Test-Path -LiteralPath (Join-Path $dataRoot 'runtime\legacy-owner.lock')) {
            throw 'Legacy runtime ownership state must not migrate'
          }
          if (Test-Path -LiteralPath (Join-Path $dataRoot 'WebView2\Cookies')) {
            throw 'Legacy WebView profile must not migrate'
          }
          $endpointText = Get-Content -LiteralPath $endpoint -Raw
          $endpointMetadata = $endpointText | ConvertFrom-Json
          if ($endpointMetadata.schema_version -ne 1) {
            throw 'Installed sidecar endpoint schema version is invalid'
          }
          if ([int]$endpointMetadata.logical_sidecar_pid -le 0) {
            throw 'Installed sidecar endpoint logical PID is invalid'
          }
          if ($endpointMetadata.host -ne '127.0.0.1') {
            throw 'Installed sidecar endpoint host is not loopback'
          }
          if ([int]$endpointMetadata.dynamic_port -le 0) {
            throw 'Installed sidecar endpoint dynamic port is invalid'
          }
          if ([string]::IsNullOrWhiteSpace([string]$endpointMetadata.generation)) {
            throw 'Installed sidecar endpoint generation is missing'
          }
          if ($endpointText -match '(?i)launch_token|app_secret|api[_-]?key|credential') {
            throw 'Installed sidecar endpoint leaked secret-bearing metadata'
          }
          $firstEndpointGeneration = [string]$endpointMetadata.generation
          Write-Host "Installed sidecar endpoint and SQLite canonical database are ready"
          $forbidden = @(Get-Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ProcessName -match $forbiddenPattern -and
              $_.Id -notin $forbiddenBefore
            })
          if ($forbidden) { throw "Developer/server runtime child detected: $($forbidden.Name -join ', ')" }
          Write-Host "No developer/server runtime child process was detected"
          $sidecars = @(Get-Process -Name 'angmoo-sidecar' -ErrorAction SilentlyContinue)
          if (-not $sidecars) { throw 'Packaged angmoo-sidecar process was not detected' }
          Assert-InstallFileManifest $installManifest 'runtime_behavior_scan'
          Assert-NoActiveDefenderDetection 'runtime_behavior_scan'
          Assert-NoNewDefenderDetection 'runtime_behavior_scan'
          $sentinel = Join-Path $dataRoot 'logs\er6-uninstall-preserve.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $sentinel) | Out-Null
          Set-Content -LiteralPath $sentinel -Value 'preserve' -Encoding ascii
          $null = $product.CloseMainWindow()
          if (-not $product.WaitForExit(10000)) {
            Stop-Process -Id $product.Id -Force -ErrorAction SilentlyContinue
            $product.WaitForExit(5000) | Out-Null
          }
          # A headless GitHub runner may not deliver a normal window-close
          # lifecycle. Stop the already-audited packaged sidecars before
          # uninstall so an install-root binary cannot keep NSIS open.
          foreach ($sidecar in $sidecars) {
            Stop-Process -Id $sidecar.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $sidecar.Id -Timeout 10 -ErrorAction SilentlyContinue
          }
          Stop-ProductWebViewProcesses `
            (Join-Path $dataRoot 'webview') `
            $webViewBefore `
            'first_runtime_shutdown'
          $databaseHashAfterFirstRun = Get-StableFileHash $database 'first_runtime_shutdown'
          $secretPath = Join-Path $dataRoot 'secrets\app-secret'
          $secretHashAfterFirstRun = Get-StableFileHash $secretPath 'first_runtime_shutdown'
          $mediaProof = Join-Path $dataRoot 'media\world-er6\banner.txt'
          $mediaHashAfterFirstRun = Get-StableFileHash $mediaProof 'first_runtime_shutdown'

          # Exercise the path that was previously missing from this workflow:
          # an installer/updater is run directly over an existing canonical
          # installation without an explicit uninstall in between. Reproduce
          # the observed mixed-payload incident by leaving the candidate
          # manifest in place while replacing only the sidecar bytes. The new
          # installer must classify this app as mixed, build a complete staging
          # candidate, and never trust the mixed app as rollback material.
          $sidecarPath = Join-Path $installRoot 'angmoo-sidecar.exe'
          [System.IO.File]::WriteAllBytes(
            $sidecarPath,
            [byte[]](0x4d, 0x5a, 0x00, 0x01)
          )
          if ((Get-FileHash -LiteralPath $sidecarPath -Algorithm SHA256).Hash -eq
              $installManifest[$sidecarPath]) {
            throw 'Mixed-payload direct update proof did not change the sidecar'
          }
          Write-Host 'Running direct in-place installer update over the existing canonical installation'
          $inPlaceUpgrade = Start-Process $installer.FullName -ArgumentList '/S', '/UPDATE' -PassThru
          if (-not $inPlaceUpgrade.WaitForExit(120000)) {
            Stop-Process -Id $inPlaceUpgrade.Id -Force -ErrorAction SilentlyContinue
            throw 'Direct in-place installer update timed out after 120 seconds'
          }
          if ($inPlaceUpgrade.ExitCode -ne 0) {
            throw "Direct in-place installer update failed: $($inPlaceUpgrade.ExitCode)"
          }
          & (Join-Path $installRoot 'verify-installed-payload.ps1') -AppRoot $installRoot
          if ($LASTEXITCODE -ne 0) { throw 'Updated host and sidecar payload digest parity failed' }
          Write-Host 'installer_payload_digest_parity_pass:direct_update'
          Assert-InstallFileManifest $installManifest 'direct_in_place_upgrade'
          foreach ($transactionRoot in @(
              (Join-Path $productRoot 'app.__install_staging__'),
              (Join-Path $productRoot 'app.__install_backup__')
            )) {
            if (Test-Path -LiteralPath $transactionRoot) {
              throw "Direct update left app transaction root: $transactionRoot"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'Angmoo.__casefix__')) {
            throw 'Direct in-place installer update left a case-normalization staging directory'
          }
          if ((Get-StableFileHash $database 'direct_in_place_upgrade') -ne $databaseHashAfterFirstRun) {
            throw 'Direct in-place installer update changed the canonical SQLite database'
          }
          if ((Get-StableFileHash $secretPath 'direct_in_place_upgrade') -ne $secretHashAfterFirstRun) {
            throw 'Direct in-place installer update changed APP_SECRET'
          }
          if ((Get-StableFileHash $mediaProof 'direct_in_place_upgrade') -ne $mediaHashAfterFirstRun) {
            throw 'Direct in-place installer update changed local media'
          }
          foreach ($entry in $legacyLauncherSecrets.GetEnumerator()) {
            $path = Join-Path $dataRoot "secrets\$($entry.Key)"
            if ((Get-StableFileHash $path 'direct_in_place_upgrade') -ne
                $legacyLauncherSecretHashes[$entry.Key]) {
              throw "Direct in-place installer update changed launcher secret: $($entry.Key)"
            }
          }
          $registeredInstallLocation =
            Get-ItemPropertyValue `
              -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Angmoo' `
              -Name InstallLocation
          if ($registeredInstallLocation.Trim('"') -ne $installRoot) {
            throw "Direct in-place installer update registered an unexpected install location: $registeredInstallLocation"
          }
          Start-MpScan -ScanType CustomScan -ScanPath $installRoot
          Assert-InstallFileManifest $installManifest 'installed_postrun_scan'
          Assert-NoActiveDefenderDetection 'installed_postrun_scan'
          Assert-NoNewDefenderDetection 'installed_postrun_scan'
          $uninstaller = Get-ChildItem $installRoot -Filter 'uninstall.exe' -Recurse |
            Select-Object -First 1
          if (-not $uninstaller) { throw 'NSIS uninstaller is missing' }
          Write-Host "Running silent uninstall while preserving local data"
          $uninstall = Start-Process $uninstaller.FullName -ArgumentList '/S' -PassThru
          if (-not $uninstall.WaitForExit(30000)) {
            Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue
            throw 'NSIS uninstall timed out after 30 seconds'
          }
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstall.ExitCode)" }
          if (-not (Test-Path $sentinel)) { throw 'Silent uninstall deleted local data' }
          Wait-InstalledApplicationRemoved $installRoot 'preserving_uninstall'
          if ((Get-StableFileHash $database 'preserving_uninstall') -ne $databaseHashAfterFirstRun) {
            throw 'Silent uninstall changed the canonical SQLite database'
          }
          if ((Get-StableFileHash $secretPath 'preserving_uninstall') -ne $secretHashAfterFirstRun) {
            throw 'Silent uninstall changed APP_SECRET'
          }
          if ((Get-StableFileHash $mediaProof 'preserving_uninstall') -ne $mediaHashAfterFirstRun) {
            throw 'Silent uninstall changed local media'
          }
          foreach ($entry in $legacyLauncherSecrets.GetEnumerator()) {
            $path = Join-Path $dataRoot "secrets\$($entry.Key)"
            if ((Get-StableFileHash $path 'preserving_uninstall') -ne
                $legacyLauncherSecretHashes[$entry.Key]) {
              throw "Silent uninstall changed launcher secret: $($entry.Key)"
            }
          }

          Write-Host 'Reinstalling into the preserved product data namespace'
          $reinstall = Start-Process $installer.FullName -ArgumentList '/S' -PassThru
          if (-not $reinstall.WaitForExit(120000)) {
            Stop-Process -Id $reinstall.Id -Force -ErrorAction SilentlyContinue
            throw 'NSIS reinstall timed out after 120 seconds'
          }
          if ($reinstall.ExitCode -ne 0) { throw "NSIS reinstall failed: $($reinstall.ExitCode)" }
          & (Join-Path $installRoot 'verify-installed-payload.ps1') -AppRoot $installRoot
          if ($LASTEXITCODE -ne 0) { throw 'Reinstalled host and sidecar payload digest parity failed' }
          Write-Host 'installer_payload_digest_parity_pass:reinstall'
          $reinstalledApp = Get-ChildItem $installRoot -Filter 'angmoo-desktop.exe' -Recurse |
            Select-Object -First 1
          if (-not $reinstalledApp) { throw 'Reinstalled angmoo-desktop.exe is missing' }
          if ((Get-StableFileHash $database 'preserved_reinstall') -ne $databaseHashAfterFirstRun) {
            throw 'Reinstall changed the preserved canonical SQLite database before launch'
          }
          if ((Get-StableFileHash $secretPath 'preserved_reinstall') -ne $secretHashAfterFirstRun) {
            throw 'Reinstall changed the preserved APP_SECRET before launch'
          }
          if ((Get-StableFileHash $mediaProof 'preserved_reinstall') -ne $mediaHashAfterFirstRun) {
            throw 'Reinstall changed preserved local media before launch'
          }
          foreach ($entry in $legacyLauncherSecrets.GetEnumerator()) {
            $path = Join-Path $dataRoot "secrets\$($entry.Key)"
            if ((Get-StableFileHash $path 'preserved_reinstall') -ne
                $legacyLauncherSecretHashes[$entry.Key]) {
              throw "Reinstall changed launcher secret: $($entry.Key)"
            }
          }

          $secondProduct = Start-Process $reinstalledApp.FullName -PassThru
          $secondDeadline = (Get-Date).AddSeconds(60)
          $secondEndpoint = $null
          while ((Get-Date) -lt $secondDeadline) {
            if (Test-Path -LiteralPath $endpoint) {
              try {
                $candidate = Get-Content -LiteralPath $endpoint -Raw | ConvertFrom-Json
                $candidatePid = [int]$candidate.logical_sidecar_pid
                $candidateGeneration = [string]$candidate.generation
                # Windows may immediately reuse a PID after the first
                # sidecar exits. The launch generation is the durable
                # identity boundary; require it to change and independently
                # prove that the advertised sidecar process is alive.
                if ($candidatePid -gt 0 -and
                    -not [string]::IsNullOrWhiteSpace($candidateGeneration) -and
                    $candidateGeneration -ne $firstEndpointGeneration -and
                    (Get-Process -Id $candidatePid -ErrorAction SilentlyContinue)) {
                  $secondEndpoint = $candidate
                  break
                }
              } catch {
                # The sidecar publishes the endpoint atomically. Retry until
                # the new generation is fully readable.
              }
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $secondEndpoint) {
            $secondHostState = if ($secondProduct.HasExited) {
              "exited:$($secondProduct.ExitCode)"
            } else {
              'running'
            }
            Write-Host "Reinstalled Tauri host state: $secondHostState"
            @(Get-Process -Name 'angmoo-sidecar' -ErrorAction SilentlyContinue) |
              Select-Object Id, ProcessName, StartTime |
              Format-Table -AutoSize |
              Out-String |
              Write-Host
            foreach ($metadataName in @('sidecar.owner.json', 'sidecar.endpoint.json')) {
              $metadataPath = Join-Path $dataRoot "runtime\$metadataName"
              if (-not (Test-Path -LiteralPath $metadataPath)) { continue }
              try {
                $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
                [ordered]@{
                  file = $metadataName
                  schema_version = $metadata.schema_version
                  logical_sidecar_pid = $metadata.logical_sidecar_pid
                  parent_pid = $metadata.parent_pid
                  dynamic_port = $metadata.dynamic_port
                  generation = $metadata.generation
                } | ConvertTo-Json -Compress | Write-Host
              } catch {
                Write-Host "Runtime metadata was not readable: $metadataName"
              }
            }
            throw 'Reinstalled runtime did not publish a fresh sidecar endpoint'
          }
          if ([string]::IsNullOrWhiteSpace([string]$secondEndpoint.generation) -or
              [string]$secondEndpoint.generation -eq $firstEndpointGeneration) {
            throw 'Reinstalled runtime did not publish a fresh launch generation'
          }
          # The ER6 preview fixture intentionally represents the one approved
          # markerless canonical layout. Its selected data generation is
          # attested by the LocalAppData migration marker, while later release
          # candidates may additionally publish canonical/current-generation.
          $reinstalledGenerationMarker =
            Get-Content -LiteralPath $migrationMarkerPath -Raw | ConvertFrom-Json
          if ($reinstalledGenerationMarker.generation -ne $fixtureManifest.generation) {
            throw 'Reinstalled runtime did not reuse the migrated canonical generation'
          }
          if ((Get-StableFileHash $secretPath 'reinstalled_runtime') -ne $secretHashAfterFirstRun) {
            throw 'Reinstalled runtime regenerated APP_SECRET'
          }
          $null = $secondProduct.CloseMainWindow()
          if (-not $secondProduct.WaitForExit(10000)) {
            Stop-Process -Id $secondProduct.Id -Force -ErrorAction SilentlyContinue
            $secondProduct.WaitForExit(5000) | Out-Null
          }
          Get-Process -Name 'angmoo-sidecar' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          $secondUninstaller = Get-ChildItem $installRoot -Filter 'uninstall.exe' -Recurse |
            Select-Object -First 1
          if (-not $secondUninstaller) { throw 'Reinstalled NSIS uninstaller is missing' }
          $finalUninstall = Start-Process $secondUninstaller.FullName -ArgumentList '/S' -PassThru
          if (-not $finalUninstall.WaitForExit(30000)) {
            Stop-Process -Id $finalUninstall.Id -Force -ErrorAction SilentlyContinue
            throw 'Final NSIS uninstall timed out after 30 seconds'
          }
          if ($finalUninstall.ExitCode -ne 0) {
            throw "Final NSIS uninstall failed: $($finalUninstall.ExitCode)"
          }
          if (-not (Test-Path $sentinel)) { throw 'Final silent uninstall deleted local data' }
          Wait-InstalledApplicationRemoved $installRoot 'final_preserving_uninstall'
          if ((Get-StableFileHash $secretPath 'final_preserving_uninstall') -ne $secretHashAfterFirstRun) {
            throw 'Final silent uninstall changed APP_SECRET'
          }
          $lifecycleEvidence = Join-Path $env:RUNNER_TEMP 'angmoo-defender-evidence'
          New-Item -ItemType Directory -Force -Path $lifecycleEvidence | Out-Null
          [ordered]@{
            schema_version = 1
            fixture_id = $fixtureManifest.fixture_id
            migration_status = $migrationMarker.status
            generation = $migrationMarker.generation
            legacy_source_preserved = $true
            legacy_runtime_excluded = $true
            legacy_webview_excluded = $true
            silent_uninstall_preserved_data = $true
            direct_in_place_upgrade_replaced_app = $true
            direct_in_place_upgrade_preserved_data = $true
            reinstall_reused_data = $true
            final_silent_uninstall_preserved_data = $true
            legacy_launcher_secret_merge = $true
            product_root_actual_name = $productRootActualName
            interactive_full_delete = 'user_gate_required'
            app_secret_sha256 = $secretHashAfterFirstRun.ToLowerInvariant()
          } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $lifecycleEvidence 'localappdata-lifecycle.json') -Encoding utf8
      - name: Capture hosted Defender evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'angmoo-defender-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Get-MpComputerStatus |
            Select-Object AMEngineVersion, AMProductVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated, RealTimeProtectionEnabled |
            ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $evidence 'computer-status.json') -Encoding utf8
          @(Get-MpThreat -ErrorAction SilentlyContinue) |
            Select-Object ThreatID, ThreatName, SeverityID, IsActive, DidThreatExecute, Resources |
            ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $evidence 'threats.json') -Encoding utf8
          @(Get-MpThreatDetection -ErrorAction SilentlyContinue) |
            Select-Object DetectionID, ThreatID, InitialDetectionTime, RemediationTime, DetectionSourceTypeID, CleaningActionID, ActionSuccess |
            ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $evidence 'threat-detections.json') -Encoding utf8
      - name: Upload hosted Defender evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: angmoo-windows-defender-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/angmoo-defender-evidence
