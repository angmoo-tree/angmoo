name: Windows Installer
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch:
    inputs:
      profile:
        description: Validation scope / 검증 범위 (full for release candidates)
        type: choice
        options:
        - full
        - auto
        default: full
        required: true
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      backend_profile: ${{ steps.select.outputs.backend_profile }}
      windows: ${{ steps.select.outputs.windows }}
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      local_core_smoke: ${{ steps.select.outputs.local_core_smoke }}
      local_autonomy_smoke: ${{ steps.select.outputs.local_autonomy_smoke }}
      local_full_graph: ${{ steps.select.outputs.local_full_graph }}
      embedded_data_migration: ${{ steps.select.outputs.embedded_data_migration }}
      tauri_windows: ${{ steps.select.outputs.tauri_windows }}
      windows_installer: ${{ steps.select.outputs.windows_installer }}
      windows_native: ${{ steps.select.outputs.windows_native }}
      tauri_windows_host_dev: ${{ steps.select.outputs.tauri_windows_host_dev }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
    - id: select
      name: Classify actual changed paths
      run: python scripts/ci/impact.py
  release-candidate:
    outputs:
      artifact_id: ${{ steps.installer-upload.outputs.artifact-id }}
    name: windows-installer-build
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 11.22.0
        run_install: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: 0.12.5
        enable-cache: false
    - name: Install locked release-candidate dependencies
      shell: pwsh
      run: |
        uv python install 3.13.12
        uv sync --frozen --directory backend --python 3.13.12
        uv pip install --python backend\.venv\Scripts\python.exe PyInstaller==6.16.0
        pnpm --dir frontend install --frozen-lockfile
        npm ci --ignore-scripts --prefix desktop
        rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
        rustup override set 1.97.1 --path desktop\src-tauri
    - name: Verify native PostgreSQL, migration input, and installer safety contracts
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $env:PYTHONPATH = 'backend;scripts/ci'
        backend\.venv\Scripts\python.exe -m pytest -q backend/tests/test_installer_update.py backend/tests/test_windows_postgresql_qualification.py backend/tests/test_l3_er5_desktop_sidecar_security.py backend/tests/test_windows_installer_i18n.py
        backend\.venv\Scripts\python.exe scripts/ci/check_desktop_installer_contract.py
        .\desktop\scripts\test-installer-payload-verifier.ps1
        .\desktop\scripts\test-installer-payload-transaction.ps1
        backend\.venv\Scripts\python.exe scripts/ci/check_er6_desktop_supply_chain.py --evidence .codex-temp/er6-supply-chain-audit.json
    - name: Audit locked runtime dependencies
      shell: pwsh
      run: |
        uv audit --project backend --locked
        pnpm --dir frontend audit --prod --audit-level high
    - name: Build bilingual NSIS Setup
      shell: pwsh
      working-directory: desktop
      run: npm run build:installer
    - name: Verify generated installer language registration
      shell: pwsh
      run: |
        backend\.venv\Scripts\python.exe scripts\ci\check_windows_installer_i18n.py `
          --generated desktop\src-tauri\target\release\nsis\x64\installer.nsi
    - name: Build Defender trigger matrix binaries
      shell: pwsh
      run: |
        $env:CARGO_TARGET_DIR = (Resolve-Path 'desktop\src-tauri\target').Path
        cargo build --manifest-path desktop\security\defender-matrix\Cargo.toml `
          --release --locked --bins
      if: needs.impact.outputs.windows == 'full'
    - name: Run pre-install Defender trigger matrix
      shell: pwsh
      run: |
        $release = 'desktop\src-tauri\target\release'
        $installer = Get-ChildItem "$release\bundle\nsis" -Filter '*setup*.exe' | Select-Object -First 1
        if (-not $installer) { throw 'NSIS installer is missing for Defender matrix' }
        .\scripts\ci\run_er6_defender_trigger_matrix.ps1 `
          -MinimalHost "$release\angmoo-defender-matrix-host.exe" `
          -StubHost "$release\angmoo-defender-matrix-stub-host.exe" `
          -RealSidecarHost "$release\angmoo-defender-matrix-real-host.exe" `
          -StubSidecar "$release\angmoo-defender-matrix-stub.exe" `
          -ActualHost "$release\angmoo-desktop.exe" `
          -ActualSidecar "$release\angmoo-sidecar.exe" `
          -PostgreSQLResources "desktop/src-tauri/resources/postgresql" `
          -Installer $installer.FullName `
          -OutputRoot '.codex-temp\er6-defender-trigger-matrix' `
          -FailOnDetection
      if: needs.impact.outputs.windows == 'full'
    - name: Preserve sanitized pre-install Defender diagnostics
      if: always() && needs.impact.outputs.windows == 'full'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: angmoo-defender-preinstall-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
        path: .codex-temp/er6-defender-trigger-matrix/er6-defender-trigger-matrix.json
        if-no-files-found: warn
        retention-days: 14
    - name: Verify packaged executables do not open consoles
      shell: pwsh
      run: |
        $release = 'desktop\src-tauri\target\release'
        $desktop = Join-Path $release 'angmoo-desktop.exe'
        $sidecar = 'desktop\src-tauri\binaries\angmoo-sidecar-x86_64-pc-windows-msvc.exe'
        backend\.venv\Scripts\python.exe scripts\ci\check_windows_gui_subsystems.py `
          $desktop $sidecar
    - name: Reject private migration artifacts
      shell: pwsh
      run: |
        $forbidden = Get-ChildItem desktop\src-tauri\target\release\bundle -Recurse -File |
          Where-Object { $_.Name -in @('release-candidate-backup.json', 'synthetic-fixture.json', 'app-secret') }
        if ($forbidden) {
          $forbidden | ForEach-Object { Write-Error "Private artifact refused: $($_.FullName)" }
          exit 1
        }
    - name: Build checksums, SPDX SBOM, provenance, and notices
      shell: pwsh
      run: |
        $productVersion = (Get-Content desktop\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
        backend\.venv\Scripts\python.exe scripts\ci\build_desktop_release_metadata.py `
          --bundle-root desktop\src-tauri\target\release\bundle `
          --output-root .codex-temp\er6-release-metadata `
          --version $productVersion `
          --commit $env:SOURCE_SHA
    - name: Package source-bound Docker migration tools and LGPL source
      shell: pwsh
      run: |
        backend\.venv\Scripts\python.exe scripts\build_docker_migrator.py --output .codex-temp\er6-release-metadata --work "$env:RUNNER_TEMP\angmoo-migration-packager" --source $env:SOURCE_SHA
        backend\.venv\Scripts\python.exe scripts\package_postgresql_sources.py --output .codex-temp\er6-release-metadata\angmoo-postgresql-sources.zip --cache "$env:RUNNER_TEMP\angmoo-postgresql-sources"
    - name: Upload release-candidate evidence
      id: installer-upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: angmoo-windows-installer-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
        if-no-files-found: error
        retention-days: 14
        path: |
          desktop/src-tauri/target/release/bundle/nsis/*.exe
          .codex-temp/er6-release-metadata/SHA256SUMS
          .codex-temp/er6-release-metadata/angmoo-installer.spdx.json
          .codex-temp/er6-release-metadata/angmoo-installer.provenance.json
          .codex-temp/er6-release-metadata/THIRD_PARTY_NOTICES.md
          .codex-temp/er6-release-metadata/LICENSE
          .codex-temp/er6-release-metadata/angmoo-migrate.exe
          .codex-temp/er6-release-metadata/angmoo-migrate.py
          .codex-temp/er6-release-metadata/angmoo-migration-tools.json
          .codex-temp/er6-release-metadata/angmoo-postgresql-sources.zip
          .codex-temp/er6-release-metadata/postgresql-resources.json
          .codex-temp/er6-supply-chain-audit.json
    - name: Attest Windows NSIS installer
      id: installer-attestation
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          desktop/src-tauri/target/release/bundle/nsis/*.exe
    - name: Preserve signed EXE attestation
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-attestation-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
        path: ${{ steps.installer-attestation.outputs.bundle-path }}
        if-no-files-found: error
        retention-days: 14
    needs:
    - impact
    if: needs.impact.outputs.windows_installer == 'true'
  windows-installer-supported-upgrade:
    name: windows-installer-supported-upgrade
    needs:
    - impact
    - release-candidate
    runs-on: windows-latest
    timeout-minutes: 35
    if: needs.impact.outputs.windows == 'full'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: &id001
        persist-credentials: false
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: 0.12.5
        enable-cache: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: angmoo-windows-installer-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/angmoo-installer
    - name: Install qualification tools only
      shell: pwsh
      run: |-
        uv python install 3.13.12
        uv sync --frozen --directory backend --python 3.13.12
    - name: Run real NSIS and packaged PostgreSQL qualification
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        .\scripts\ci\run_windows_postgresql_qualification.ps1 -InstallerRoot "$env:RUNNER_TEMP/angmoo-installer" -Kind upgrade-013 -Python (Resolve-Path 'backend/.venv/Scripts/python.exe').Path -Output "$env:RUNNER_TEMP/angmoo-postgresql-upgrade-013.json"
    - name: Preserve exact qualification checks
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-upgrade-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-upgrade-013
        path: ${{ runner.temp }}/angmoo-postgresql-upgrade-013.json
        if-no-files-found: error
        retention-days: 14
    - name: Preserve sanitized Defender diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: angmoo-windows-defender-evidence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-upgrade-013
        path: ${{ runner.temp }}/angmoo-windows-defender-evidence-upgrade-013.json
        if-no-files-found: warn
        retention-days: 14
    - name: Bind successful test to actual installer bytes
      if: success() && needs.impact.outputs.windows == 'full'
      shell: pwsh
      run: backend/.venv/Scripts/python.exe -m scripts.release.windows_receipt job --root "$env:RUNNER_TEMP/angmoo-installer" --kind upgrade-013
        --artifact-id "${{ needs.release-candidate.outputs.artifact_id }}" --output "$env:RUNNER_TEMP/installer-receipt-upgrade-013.json"
    - name: Preserve successful installer receipt
      if: success() && needs.impact.outputs.windows == 'full'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-tested-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-upgrade-013
        path: ${{ runner.temp }}/installer-receipt-upgrade-013.json
        if-no-files-found: error
        retention-days: 14
  windows-installer-failure-recovery:
    name: windows-installer-failure-recovery
    needs:
    - impact
    - release-candidate
    runs-on: windows-latest
    timeout-minutes: 35
    if: needs.impact.outputs.windows == 'full'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: *id001
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: 0.12.5
        enable-cache: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: angmoo-windows-installer-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/angmoo-installer
    - name: Install qualification tools only
      shell: pwsh
      run: |-
        uv python install 3.13.12
        uv sync --frozen --directory backend --python 3.13.12
    - name: Run real NSIS and packaged PostgreSQL qualification
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        .\scripts\ci\run_windows_postgresql_qualification.ps1 -InstallerRoot "$env:RUNNER_TEMP/angmoo-installer" -Kind failure-recovery -Python (Resolve-Path 'backend/.venv/Scripts/python.exe').Path -Output "$env:RUNNER_TEMP/angmoo-postgresql-failure-recovery.json"
    - name: Preserve exact qualification checks
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-upgrade-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-failure-recovery
        path: ${{ runner.temp }}/angmoo-postgresql-failure-recovery.json
        if-no-files-found: error
        retention-days: 14
    - name: Preserve sanitized Defender diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: angmoo-windows-defender-evidence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-failure-recovery
        path: ${{ runner.temp }}/angmoo-windows-defender-evidence-failure-recovery.json
        if-no-files-found: warn
        retention-days: 14
    - name: Bind successful test to actual installer bytes
      if: success() && needs.impact.outputs.windows == 'full'
      shell: pwsh
      run: backend/.venv/Scripts/python.exe -m scripts.release.windows_receipt job --root "$env:RUNNER_TEMP/angmoo-installer" --kind failure-recovery
        --artifact-id "${{ needs.release-candidate.outputs.artifact_id }}" --output "$env:RUNNER_TEMP/installer-receipt-failure-recovery.json"
    - name: Preserve successful installer receipt
      if: success() && needs.impact.outputs.windows == 'full'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-tested-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-failure-recovery
        path: ${{ runner.temp }}/installer-receipt-failure-recovery.json
        if-no-files-found: error
        retention-days: 14
  installed-runtime-smoke:
    name: windows-installer-clean-install
    needs:
    - impact
    - release-candidate
    runs-on: windows-latest
    timeout-minutes: 35
    if: needs.impact.outputs.windows_installer == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: *id001
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: 0.12.5
        enable-cache: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: angmoo-windows-installer-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/angmoo-installer
    - name: Install qualification tools only
      shell: pwsh
      run: |-
        uv python install 3.13.12
        uv sync --frozen --directory backend --python 3.13.12
    - name: Run real NSIS and packaged PostgreSQL qualification
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        .\scripts\ci\run_windows_postgresql_qualification.ps1 -InstallerRoot "$env:RUNNER_TEMP/angmoo-installer" -Kind clean-install -Python (Resolve-Path 'backend/.venv/Scripts/python.exe').Path -Output "$env:RUNNER_TEMP/angmoo-postgresql-clean-install.json"
    - name: Preserve exact qualification checks
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-upgrade-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-clean-install
        path: ${{ runner.temp }}/angmoo-postgresql-clean-install.json
        if-no-files-found: error
        retention-days: 14
    - name: Preserve sanitized Defender diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: angmoo-windows-defender-evidence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-clean-install
        path: ${{ runner.temp }}/angmoo-windows-defender-evidence-clean-install.json
        if-no-files-found: warn
        retention-days: 14
    - name: Bind successful test to actual installer bytes
      if: success() && needs.impact.outputs.windows == 'full'
      shell: pwsh
      run: backend/.venv/Scripts/python.exe -m scripts.release.windows_receipt job --root "$env:RUNNER_TEMP/angmoo-installer" --kind clean-install
        --artifact-id "${{ needs.release-candidate.outputs.artifact_id }}" --output "$env:RUNNER_TEMP/installer-receipt-clean-install.json"
    - name: Preserve successful installer receipt
      if: success() && needs.impact.outputs.windows == 'full'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-tested-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-clean-install
        path: ${{ runner.temp }}/installer-receipt-clean-install.json
        if-no-files-found: error
        retention-days: 14
  windows-installer:
    if: always()
    needs:
    - impact
    - release-candidate
    - installed-runtime-smoke
    - windows-installer-supported-upgrade
    - windows-installer-failure-recovery
    - windows-installer-representative-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
      CI_NEEDS: ${{ toJSON(needs) }}
      SUPPORTED_UPGRADE_RESULT: ${{ needs.windows-installer-supported-upgrade.result }}
      FAILURE_RECOVERY_RESULT: ${{ needs.windows-installer-failure-recovery.result }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
    - name: Require every selected Windows installer Gate
      run: |-
        python scripts/ci/gate.py --gate windows-installer
        echo windows_installer_required_matrix_pass
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      if: needs.impact.outputs.windows_installer == 'true'
      with:
        pattern: windows-upgrade-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-*
        merge-multiple: true
        path: .ci/windows-upgrade-reports
    - name: Require exact PostgreSQL qualification union
      if: needs.impact.outputs.windows_installer == 'true'
      run: python scripts/ci/windows_postgresql_coverage.py --directory .ci/windows-upgrade-reports --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
        --run-attempt "$GITHUB_RUN_ATTEMPT" --profile "${{ needs.impact.outputs.windows }}"
    - name: Collect exact successful installer receipts
      if: needs.impact.outputs.windows == 'full'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: windows-tested-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-*
        merge-multiple: true
        path: .ci/windows-tested
    - name: Bind full release validation to the tested EXE
      if: needs.impact.outputs.windows == 'full'
      run: python -m scripts.release.windows_receipt aggregate --receipts .ci/windows-tested --coverage .ci/windows-upgrade-reports --output .ci/windows-release-validation.json
    - name: Preserve full release validation receipt
      if: needs.impact.outputs.windows == 'full'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-release-validation-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
        path: .ci/windows-release-validation.json
        if-no-files-found: error
        retention-days: 14
  windows-installer-representative-upgrade:
    name: windows-installer-supported-upgrade
    needs:
    - impact
    - release-candidate
    runs-on: windows-latest
    timeout-minutes: 35
    if: needs.impact.outputs.windows == 'installer-smoke'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: *id001
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: 0.12.5
        enable-cache: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: angmoo-windows-installer-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/angmoo-installer
    - name: Install qualification tools only
      shell: pwsh
      run: |-
        uv python install 3.13.12
        uv sync --frozen --directory backend --python 3.13.12
    - name: Run real NSIS and packaged PostgreSQL qualification
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        .\scripts\ci\run_windows_postgresql_qualification.ps1 -InstallerRoot "$env:RUNNER_TEMP/angmoo-installer" -Kind upgrade-013 -Python (Resolve-Path 'backend/.venv/Scripts/python.exe').Path -Output "$env:RUNNER_TEMP/angmoo-postgresql-upgrade-013.json"
    - name: Preserve exact qualification checks
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
