name: Security and Governance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  oss-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install checker dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Verify Local OSS policy and inventories
        run: |
          uv run --project backend python scripts/check_ci_policy.py
          uv run --project backend python scripts/ci/check_oss_boundary.py
          uv run --project backend python scripts/ci/check_secret_allowlist_metadata.py
          uv run --project backend python scripts/ci/check_container_release_contract.py
          uv run --project backend python scripts/ci/check_local_launcher_contract.py
          uv run --project backend python scripts/ci/check_desktop_installer_contract.py
          uv run --project backend python scripts/ci/check_windows_host_tauri_dev_contract.py
          uv run --project backend python scripts/ci/generate_architecture_inventory.py --check
          uv run --project backend python scripts/ci/generate_deferred_runtime_inventory.py --check
      - name: Scan current repository and full history
        run: |
          uv run --directory backend python ../scripts/security_secret_scan.py --git-tree HEAD
          uv run --directory backend python ../scripts/security_secret_scan.py --history --history-limit 0
      - name: Run Gitleaks directory and history scans
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/tracked-tree"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked-tree"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/tracked-tree" --config .gitleaks.toml --redact --no-banner
          # Match this candidate configuration to its complete ancestor history.
          # Other fetched PR refs may contain later source-evidence fingerprints.
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="HEAD" --config .gitleaks.toml --redact --no-banner

  dependency-license:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review pull request dependency changes
        id: dependency_review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Match security/license_policy.json; a GPL-2.0-or-later deny rule
          # also matches GPL-3.0-only in this Action's SPDX range comparison.
          # Package/version review and exact forbidden IDs remain checked below.
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC-BY-4.0, CC0-1.0, GPL-3.0-only, GPL-3.0-or-later, ISC, LGPL-2.1-or-later, LGPL-3.0-only, MIT, MIT-CMU, MPL-2.0, PSF-2.0, Python-2.0, UPL-1.0, Zlib
      - name: Enforce exact forbidden license identifiers
        if: github.event_name == 'pull_request'
        env:
          DEPENDENCY_CHANGES: ${{ steps.dependency_review.outputs.dependency-changes }}
        run: python scripts/check_dependency_licenses.py --review-changes-env DEPENDENCY_CHANGES
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - name: Install locked dependencies
        shell: bash
        run: |
          # Audit PostgreSQL runtime and SQLite migration-input dependencies.
          uv sync --frozen --directory backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Audit vulnerabilities
        shell: bash
        run: |
          uv audit --project backend --locked
          pnpm --dir frontend audit --prod --audit-level high
      - name: Verify GPL, dependency licenses, and notice
        shell: bash
        run: |
          uv run --directory backend python ../scripts/check_project_license.py \
            --repo-root .. --policy ../security/license_policy.json
          uv run --directory backend python ../scripts/check_dependency_licenses.py \
            --repo-root .. \
            --policy ../security/license_policy.json \
            --check-notice ../THIRD_PARTY_NOTICES.md

  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify DCO trailers
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci/check_dco.py --base "$BASE_SHA" --head "$HEAD_SHA"

  architecture-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Verify immutable checkpoint and introduced-commit provenance.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Verify deterministic import baseline and domain boundaries
        run: |
          uv run --project backend python scripts/ci/generate_architecture_inventory.py --check
          uv run --project backend python scripts/ci/check_architecture_boundaries.py
          uv run --project backend python scripts/ci/check_frontend_architecture_boundaries.py
          uv run --project backend python scripts/ci/check_frontend_design_contract.py --check
          uv run --directory backend python -m pytest -q \
            tests/test_oss_architecture_boundaries.py \
            tests/test_t2_architecture_inventory.py \
            tests/test_t2_5_architecture_boundaries.py \
            tests/test_l2_5_frontend_architecture_boundaries.py \
            tests/test_refactor_architecture_boundaries.py \
            tests/test_refactor_frontend_foundation.py \
            tests/test_refactor_backend_partial_scopes.py \
            tests/test_refactor_backend_checkpoint.py
          uv run --directory backend python -m pytest -q \
            tests/test_l3_er7_windows_host_tauri_dev_contract.py \
            tests/world_packages/test_v1_contract.py \
            tests/world_packages/test_preview.py \
            tests/world_packages/test_closeout.py \
            tests/world_packages/test_closeout_contract.py \
            tests/test_l4_pr_f_closeout_contract.py
      - name: Verify current runtime owners and selected-test coverage
        run: >-
          uv run --directory backend python -m pytest -q
          tests/runtime/test_app_factory_ownership.py
          tests/runtime/test_asgi_preservation.py
          tests/chat/test_service_ownership.py
          tests/chat/test_response_lifecycle_owner.py
          tests/test_ci_impact.py
          tests/test_backend_ci_shard_coverage.py
