name: Security and Governance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  oss-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install checker dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Verify Local OSS policy and inventories
        run: |
          uv run --project backend python scripts/check_ci_policy.py
          uv run --project backend python scripts/ci/check_oss_boundary.py
          uv run --project backend python scripts/ci/check_secret_allowlist_metadata.py
          uv run --project backend python scripts/ci/check_container_release_contract.py
          uv run --project backend python scripts/ci/check_local_launcher_contract.py
          uv run --project backend python scripts/ci/check_desktop_installer_contract.py
          uv run --project backend python scripts/ci/check_windows_host_tauri_dev_contract.py
          uv run --project backend python scripts/ci/generate_architecture_inventory.py --check
          uv run --project backend python scripts/ci/generate_deferred_runtime_inventory.py --check
      - name: Scan current repository and full history
        run: |
          uv run --directory backend python ../scripts/security_secret_scan.py --git-tree HEAD
          uv run --directory backend python ../scripts/security_secret_scan.py --history --history-limit 0
      - name: Run Gitleaks directory and history scans
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/tracked-tree"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked-tree"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/tracked-tree" --config .gitleaks.toml --redact --no-banner
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --redact --no-banner

  dependency-license:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review pull request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, SSPL-1.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - name: Install locked dependencies
        shell: bash
        run: |
          # Audit the complete SQLite-only product and contributor lock.
          uv sync --frozen --directory backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Audit vulnerabilities
        shell: bash
        run: |
          uv audit --project backend --locked
          pnpm --dir frontend audit --prod --audit-level high
      - name: Verify GPL, dependency licenses, and notice
        shell: bash
        run: |
          uv run --directory backend python ../scripts/check_project_license.py \
            --repo-root .. --policy ../security/license_policy.json
          uv run --directory backend python ../scripts/check_dependency_licenses.py \
            --repo-root .. \
            --policy ../security/license_policy.json \
            --check-notice ../THIRD_PARTY_NOTICES.md

  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify DCO trailers
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci/check_dco.py --base "$BASE_SHA" --head "$HEAD_SHA"

  architecture-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Verify deterministic import baseline and domain boundaries
        run: |
          uv run --project backend python scripts/ci/generate_architecture_inventory.py --check
          uv run --project backend python scripts/ci/check_architecture_boundaries.py
          uv run --project backend python scripts/ci/check_frontend_architecture_boundaries.py
          uv run --directory backend python -m pytest -q \
            tests/test_oss_architecture_boundaries.py \
            tests/test_t2_architecture_inventory.py \
            tests/test_t2_5_architecture_boundaries.py \
            tests/test_l2_5_frontend_architecture_boundaries.py
          uv run --directory backend python -m pytest -q \
            tests/test_l3_er7_windows_host_tauri_dev_contract.py
