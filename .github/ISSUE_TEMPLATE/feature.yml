name: Feature proposal
description: Propose a focused Angmoo Local OSS improvement
title: "[Proposal] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Proposals may be written in English or Korean. Features and structural changes should agree scope before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What local user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed Local OSS scope
      description: Include Device, Studio, World, Package, and affected contracts. State what remains out of scope.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Schema, provider, secret, and data impact
      description: Describe migrations, provider calls, BYOK, backups, rollback, and synthetic validation.
    validations:
      required: true
  - type: textarea
    id: legacy
    attributes:
      label: Legacy path and removal condition
      description: List compatibility paths that remain and their removal condition.
