name: Bug report
description: Report a reproducible Angmoo Local OSS defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Reports may be written in English or Korean. Do not include credentials, personal data, backups, World Packages, or unredacted logs.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Local profile
      description: Operating system, Docker or native services, and enabled Local profile
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal steps using fake credentials and synthetic data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Affected contract and rollback
      description: Note schema, migration, provider, data, backup, or rollback impact when relevant
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials, personal data, backups, World Packages, and raw logs.
          required: true
