version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)
