name: angmoo-p7-graph

services:
  neo4j:
    image: neo4j@sha256:42fd5b9ead4dd4211f6f91bd831c358e4e2117367d04633fbf88682ca4792b30
    container_name: angmoo-p7-neo4j
    restart: "no"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be provided by the local secret launcher}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_db_memory_transaction_total_max: 256m
      NEO4J_db_memory_transaction_max: 64m
    volumes:
      - angmoo-p7-neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:7474/ || exit 1
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
    mem_limit: 2g
    cpus: 1.5

volumes:
  angmoo-p7-neo4j-data:
    name: angmoo-p7-neo4j-data
