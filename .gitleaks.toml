  '''^\s*"CredentialUpsert": "443c20e3181d3e628bb23ab814b03964a95f10b5bec21e3e9a0733f04307f943",?\s*$''',
  '''^\s*"DELETE\ /api/v1/agents/\{character_id\}/credential": "5c24613353cbb4960cd231feca31ccac31ba2fe6878a220d07b9ef43ad185b4f",?\s*$''',
  '''^\s*"DELETE\ /api/v1/agents/\{character_id\}/image\-settings/key": "66aa77475f8e34060c5e9a968788cea4aff5de480ab424da4c51f55116c26c05",?\s*$''',
  '''^\s*"DELETE\ /api/v1/agents/\{character_id\}/local\-key": "d1eb43cbcb2f019faa3871663386f31f588ca09cbba41f4c2fe567b47d49d729",?\s*$''',
  '''^\s*"GET\ /api/v1/agents/\{character_id\}/credential": "68089162f0a23331338cb9ce12a1c5962d6651bc233d34d04a62c7f31b4602eb",?\s*$''',
  '''^\s*"POST\ /api/v1/agents/\{character_id\}/local\-key": "d78fdea308c61d4f962f6b964f27fdea52f7a53fa7844cf38f8d67b7970c9028",?\s*$''',
  '''^\s*"PUT\ /api/v1/agents/\{character_id\}/credential": "69a66509c773ac84059287ec8edc68a162a70b12dd25b4c9b0f0992c44febed5",?\s*$''',
  '''^\s*"agent_local_keys": "9e6de93ecdf4afacf26d0b265ecab2ad56285201eee66d02c47d0d02817cb132",?\s*$''',
