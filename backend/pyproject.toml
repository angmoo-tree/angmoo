[project]
name = "backend"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "google-auth[requests]>=2.40.0",
    "google-genai>=2.18.1",
    "ladybug==0.19.1",
    "langgraph>=1.2.11",
    "oci>=2.175.0",
    "pillow>=12.0.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.30",
    "sqlalchemy>=2.0.52",
    "tzdata>=2026.3",
    "uvicorn>=0.52.3",
    "websockets>=16.0",
]

[project.optional-dependencies]
legacy-migration = [
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
