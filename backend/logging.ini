; Application defaults and the existing Uvicorn console configuration.
; Root deliberately has no installed handler: preserve embedding/test handlers
; and Python's existing WARNING last-resort behavior. No file/rotation policy.
[logger_root]
level = WARNING

[logger_uvicorn]
level = INFO
propagate = false

[logger_uvicorn_error]
level = INFO

[logger_uvicorn_access]
level = INFO
propagate = false

[formatter_default]
class = uvicorn.logging.DefaultFormatter
format = %(levelprefix)s %(message)s

[formatter_access]
class = uvicorn.logging.AccessFormatter
format = %(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s

[handler_default]
stream = stderr

[handler_access]
stream = stdout
