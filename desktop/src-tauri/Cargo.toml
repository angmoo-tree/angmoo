[package]
name = "angmoo-desktop"
version = "0.4.0-1"
description = "Angmoo Tauri product windows"
authors = ["Angmoo contributors"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.97.1"

[package.metadata.tauri-winres]
OriginalFilename = "angmoo-desktop.exe"
InternalName = "Angmoo"
LegalCopyright = "Copyright (c) 2026 Angmoo contributors"
Comments = "Local-first AI character social world"

[lib]
name = "angmoo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Compile-time only development profile used by scripts/dev/desktop-dev.ps1.
# It deliberately cannot spawn the bundled FastAPI sidecar or select installed
# product data. Release builds never enable this feature.
contributor-docker-bridge = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-runtime = "=2.11.3"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-dialog = "=2.7.2"
uuid = { version = "=1.24.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
