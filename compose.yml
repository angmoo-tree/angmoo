name: angmoo
services:
  postgres:
    image: ghcr.io/angmoo-tree/angmoo-postgres:${ANGMOO_IMAGE_TAG:-release-v0.1.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: angmoo_owner
      POSTGRES_DB: angmoo
      ANGMOO_BOOTSTRAP_SECRETS: /run/angmoo-bootstrap
    volumes:
    - angmoo_postgresql_data:/var/lib/postgresql/data
    - angmoo_postgresql_bootstrap:/run/angmoo-bootstrap
    command:
    - postgres
    - -c
    - max_connections=28
    - -c
    - shared_buffers=64MB
    - -c
    - work_mem=4MB
    - -c
    - max_pred_locks_per_transaction=256
    - -c
    - max_pred_locks_per_relation=32
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - angmoo_owner
      - -d
      - angmoo
      interval: 5s
      timeout: 5s
      retries: 24
    stop_grace_period: 120s
  backend:
    image: ghcr.io/angmoo-tree/angmoo-backend:${ANGMOO_IMAGE_TAG:-release-v0.1.4}
    pull_policy: missing
    restart: unless-stopped
    init: true
    user: 0:0
    command:
    - postgresql-api
    environment:
      ANGMOO_VERSION: ${ANGMOO_VERSION:-0.1.4}
      ANGMOO_CONTRIBUTOR_DATA_ROOT: /var/lib/angmoo
      ANGMOO_FRONTEND_ORIGIN: http://127.0.0.1:${ANGMOO_PORT:-3000}
      ANGMOO_BOOTSTRAP_SECRETS: /run/angmoo-bootstrap
    volumes:
    - angmoo_postgresql_app_data:/var/lib/angmoo
    - angmoo_postgresql_bootstrap:/run/angmoo-bootstrap:ro
    - angmoo_contributor_embedded_data:/var/lib/angmoo-legacy:ro
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',
        timeout=3)); assert p['status']=='ok' and p['persistence']=='postgresql' and
        p['graph']=='ladybug'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 200s
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: ghcr.io/angmoo-tree/angmoo-frontend:${ANGMOO_IMAGE_TAG:-release-v0.1.4}
    pull_policy: missing
    restart: unless-stopped
    init: true
    environment:
      ANGMOO_API_BASE_URL: http://backend:8080
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
    - 127.0.0.1:${ANGMOO_PORT:-3000}:3000
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 20s
volumes:
  angmoo_contributor_embedded_data: null
  angmoo_postgresql_data: null
  angmoo_postgresql_app_data: null
  angmoo_postgresql_bootstrap: null
