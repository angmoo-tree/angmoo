services:
  db:
    image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: angmoo
      POSTGRES_USER: angmoo
      POSTGRES_PASSWORD: angmoo-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angmoo -d angmoo"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - angmoo_pgdata:/var/lib/postgresql/data

volumes:
  angmoo_pgdata:
