name: angmoo

# The official contributor runtime is the same embedded architecture shipped
# by the installed product. Docker is only the reproducible Linux packaging:
# it does not select PostgreSQL, Neo4j, or external worker processes.
x-backend-image: &backend-image ghcr.io/angmoo-tree/angmoo-backend:${ANGMOO_VERSION:-v0.3.0}
x-backend-environment: &backend-environment
  ANGMOO_VERSION: ${ANGMOO_VERSION:-v0.3.0}
  ANGMOO_CONTRIBUTOR_DATA_ROOT: /var/lib/angmoo
  ANGMOO_FRONTEND_ORIGIN: http://127.0.0.1:${ANGMOO_PORT:-3000}

services:
  backend:
    image: *backend-image
    pull_policy: missing
    restart: unless-stopped
    init: true
    # Root is used only to initialize ownership on a new named volume. The
    # entrypoint drops to uid/gid 10001 before Python starts.
    user: "0:0"
    command: ["contributor-api"]
    environment: *backend-environment
    volumes:
      - angmoo_contributor_embedded_data:/var/lib/angmoo
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)); assert p['status']=='ok' and p['persistence']=='sqlite' and p['graph']=='ladybug'"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 30s

  frontend:
    image: ghcr.io/angmoo-tree/angmoo-frontend:${ANGMOO_VERSION:-v0.3.0}
    pull_policy: missing
    restart: unless-stopped
    init: true
    environment:
      ANGMOO_API_BASE_URL: http://backend:8080
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${ANGMOO_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 20s

volumes:
  # Contributor-only. Never bind or copy installed %LOCALAPPDATA%\Angmoo data.
  angmoo_contributor_embedded_data:
