x-backend-ci-image: &backend-ci-image angmoo-backend-ci:${ANGMOO_CI_IMAGE_TAG:-ci}

services:
  backend:
    image: *backend-ci-image
    platform: ${ANGMOO_CI_PLATFORM:-linux/amd64}
    pull_policy: never

  frontend:
    image: angmoo-frontend-ci:${ANGMOO_CI_IMAGE_TAG:-ci}
    platform: ${ANGMOO_CI_PLATFORM:-linux/amd64}
    pull_policy: never
